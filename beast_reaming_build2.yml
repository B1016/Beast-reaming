              fun loginToRemoteHost() {
                  if (!isReceiveEnabled) {
                      Toast.makeText(context, "Turn ON Receive Mode first", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val cleanIp = remoteHostIp.trim().removePrefix("http://").removePrefix("https://").substringBefore(":")
                  val cleanPort = remoteHostPort.trim().ifEmpty { "8080" }
                  val u = remoteUsername.trim()
                  val p = remotePassword.trim()
                  if (cleanIp.isEmpty()) {
                      Toast.makeText(context, "Enter the Host IP address", Toast.LENGTH_SHORT).show()
                      return
                  }
                  isConnectingRemote = true
                  remoteStatusMsg = "Authenticating with $cleanIp:$cleanPort..."
                  prefs.edit()
                      .putString("remote_ip", cleanIp)
                      .putString("remote_port", cleanPort)
                      .putString("remote_user", u)
                      .putString("remote_pass", p)
                      .apply()

                  scope.launch(Dispatchers.IO) {
                      try {
                          val uEnc = URLEncoder.encode(u, "UTF-8")
                          val pEnc = URLEncoder.encode(p, "UTF-8")
                          val endpoint = URL("http://$cleanIp:$cleanPort/api/catalog?u=$uEnc&p=$pEnc")
                          val conn = (endpoint.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 4000
                              readTimeout = 5000
                              requestMethod = "GET"
                              setRequestProperty("X-Beast-User", u)
                              setRequestProperty("X-Beast-Pass", p)
                          }
                          val code = conn.responseCode
                          if (code == 200) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(body)
                              val hostTitle = json.optString("hostName", cleanIp)
                              val fArr = json.optJSONArray("folders") ?: JSONArray()
                              val parsedFolders = mutableListOf<TextVal>()
                              for (i in 0 until fArr.length()) parsedFolders.add(fArr.getString(i))

                              val itemsArr = json.optJSONArray("items") ?: JSONArray()
                              val parsedItems = mutableListOf<BeastRemoteItem>()
                              for (i in 0 until itemsArr.length()) {
                                  val obj = itemsArr.getJSONObject(i)
                                  val webPath = obj.optString("webStreamPath", "")
                                  val vlcPath = obj.optString("vlcPath", "")
                                  val srtPath = obj.optString("srtPath", "")
                                  parsedItems.add(
                                      BeastRemoteItem(
                                          id = obj.optInt("id", i + 1),
                                          name = obj.optString("name", "Video_${i + 1}"),
                                          folderName = obj.optString("folderName", "Shared"),
                                          sizeBytes = obj.optLong("sizeBytes", 0L),
                                          mimeType = obj.optString("mimeType", "video/mp4"),
                                          streamUrl = "http://$cleanIp:$cleanPort$webPath?u=$uEnc&p=$pEnc",
                                          vlcUrl = "http://$cleanIp:$cleanPort$vlcPath",
                                          srtUrl = if (srtPath.isNotEmpty()) "http://$cleanIp:$cleanPort$srtPath?u=$uEnc&p=$pEnc" else ""
                                      )
                                  )
                              }
                              val sortedRemote = parsedItems.sortedBy { it.name.lowercase(Locale.ROOT) }
                              withContext(Dispatchers.Main) {
                                  remoteFolders = parsedFolders
                                  remoteCatalog = sortedRemote
                                  remoteStatusMsg = "Logged in to $hostTitle • ${sortedRemote.size} files (A–Z)"
                                  isConnectingRemote = false
                                  appendLog("AUTH", "Logged in to remote host $hostTitle ($cleanIp:$cleanPort)", false)
                                  filesSourceMode = 1
                                  selectedDockTab = 1
                              }
                          } else if (code == 401) {
                              withContext(Dispatchers.Main) {
                                  remoteStatusMsg = "Login rejected (401): Invalid Username or Password"
                                  isConnectingRemote = false
                                  appendLog("AUTH", "Remote login failed (401) on $cleanIp", true)
                              }
                          } else {
                              withContext(Dispatchers.Main) {
                                  remoteStatusMsg = "Host returned HTTP $code (Check if Host on Web & App is ON)"
                                  isConnectingRemote = false
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              remoteStatusMsg = "Connection failed: ${e.localizedMessage ?: "Check IP & Wi-Fi/Hotspot"}"
                              isConnectingRemote = false
                              appendLog("ERROR", "Remote connect error ($cleanIp): ${e.localizedMessage}", true)
                          }
                      }
                  }
              }

