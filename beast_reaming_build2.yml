          typealias TextVal = String

          data class BeastFolderSlot(
              val uriString: TextVal,
              val displayName: TextVal,
              val itemCount: Int
          )

          data class BeastMediaItem(
              val id: Int,
              val name: TextVal,
              val folderName: TextVal,
              val sizeBytes: Long,
              val mimeType: TextVal,
              val uri: Uri,
              val srtUri: Uri?,
              val vlcPath: TextVal,
              val webStreamPath: TextVal,
              val srtPath: TextVal
          )

          data class BeastRemoteItem(
              val id: Int,
              val name: TextVal,
              val folderName: TextVal,
              val sizeBytes: Long,
              val mimeType: TextVal,
              val streamUrl: TextVal,
              val vlcUrl: TextVal,
              val srtUrl: TextVal
          )

          data class BeastLogEntry(
              val id: Long,
              val timeText: TextVal,
              val tag: TextVal,
              val message: TextVal,
              val isError: Boolean = false
          )

          data class BeastSubtitleCue(
              val startMs: Long,
              val endMs: Long,
              val text: TextVal
          )

          data class BeastAuthPair(
              val user: TextVal,
              val pass: TextVal
          )

          data class BeastDocNode(
              val doc: DocumentFile,
              val fileName: TextVal,
              val folderLabel: TextVal
          )

          class BeastVideoHolder(var view: VideoView? = null)

          data class BeastScanResult(
              val slots: List<BeastFolderSlot>,
              val items: List<BeastMediaItem>
          )

          class BoundedStream(
              inner: InputStream,
              private var bytesRemaining: Long
          ) : FilterInputStream(inner) {
              override fun read(): Int {
                  if (bytesRemaining <= 0L) return -1
                  val result = super.read()
                  if (result != -1) bytesRemaining--
                  return result
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  if (bytesRemaining <= 0L) return -1
                  val maxToRead = minOf(length.toLong(), bytesRemaining).toInt()
                  val count = super.read(buffer, offset, maxToRead)
                  if (count > 0) bytesRemaining -= count.toLong()
                  return count
              }
          }

          class BeastHttpServer(
              private val resolver: ContentResolver,
              port: Int,
              private val webAppEnabledProvider: () -> Boolean,
              private val vlcEnabledProvider: () -> Boolean,
              private val credentialsProvider: () -> BeastAuthPair,
              private val catalogProvider: () -> List<BeastMediaItem>,
              private val folderNamesProvider: () -> List<TextVal>,
              private val logger: (TextVal, TextVal, Boolean) -> Unit
          ) : NanoHTTPD(port) {

              private fun checkAuth(session: IHTTPSession): Boolean {
                  val (expectedUser, expectedPass) = credentialsProvider()
                  if (expectedUser.isBlank() && expectedPass.isBlank()) return true
                  val headerUser = session.headers["x-beast-user"] ?: ""
                  val headerPass = session.headers["x-beast-pass"] ?: ""
                  if (headerUser == expectedUser && headerPass == expectedPass) return true
                  val params = session.parameters
                  val qUser = params["u"]?.firstOrNull() ?: ""
                  val qPass = params["p"]?.firstOrNull() ?: ""
                  return qUser == expectedUser && qPass == expectedPass
              }

              override fun serve(session: IHTTPSession): Response {
                  val uriPath = session.uri ?: "/"
                  val clientIp = session.remoteIpAddress ?: "LAN"

                  // 1. Dedicated VLC Streaming Endpoints (/vlc/<id>/...)
                  if (uriPath.startsWith("/vlc/")) {
                      if (!vlcEnabledProvider()) {
                          logger("VLC", "Blocked VLC request from $clientIp (Host on VLC is OFF)", true)
                          return newFixedLengthResponse(
                              Response.Status.FORBIDDEN,
                              MIME_PLAINTEXT,
                              "Host on VLC is currently turned OFF in Beast Reaming."
                          )
                      }
                      val segments = uriPath.removePrefix("/vlc/").split("/")
                      val itemId = segments.firstOrNull()?.toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "File not found")
                      if (segments.lastOrNull()?.endsWith(".srt") == true && media.srtUri != null) {
                          logger("VLC", "Serving .srt subtitle for ${media.name} to $clientIp", false)
                          val srtStream = resolver.openInputStream(media.srtUri)
                              ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "No SRT")
                          return newChunkedResponse(Response.Status.OK, "text/plain; charset=utf-8", srtStream)
                      }
                      logger("VLC", "VLC stream connected ($clientIp) -> ${media.name}", false)
                      return serveMediaWithRange(session, media, clientIp, "VLC")
                  }

                  // 2. Web & App Hosting Endpoints (requires Host on Web & App ON + User Login)
                  if (!webAppEnabledProvider()) {
                      logger("WEB/APP", "Blocked Web/App access from $clientIp (Host on Web & App is OFF)", true)
                      return newFixedLengthResponse(
                          Response.Status.FORBIDDEN,
                          "text/html; charset=utf-8",
                          "<html><body style='background:#0b0716;color:#ffd54f;font-family:sans-serif;padding:40px;text-align:center;'><h2>Host on Web &amp; App is currently OFF</h2><p>Enable 'Host on Web &amp; App' on the hosting Android device.</p></body></html>"
                      )
                  }

                  if (uriPath == "/api/login" || uriPath == "/api/catalog") {
                      if (!checkAuth(session)) {
                          logger("AUTH", "Failed login attempt from $clientIp", true)
                          val err = JSONObject().apply {
                              put("ok", false)
                              put("error", "Invalid username or password")
                          }
                          return newFixedLengthResponse(Response.Status.UNAUTHORIZED, "application/json", err.toString()).apply {
                              addHeader("Access-Control-Allow-Origin", "*")
                          }
                      }
                      val (u, _) = credentialsProvider()
                      logger("AUTH", "User '$u' authenticated from $clientIp", false)
                      val sortedItems = catalogProvider().sortedBy { it.name.lowercase(Locale.ROOT) }
                      val root = JSONObject()
                      root.put("ok", true)
                      root.put("app", "BeastReaming")
                      root.put("hostName", Build.MODEL ?: "Android Beast Host")
                      root.put("vlcEnabled", vlcEnabledProvider())
                      val foldersArr = JSONArray()
                      folderNamesProvider().forEach { foldersArr.put(it) }
                      root.put("folders", foldersArr)
                      val itemsArr = JSONArray()
                      sortedItems.forEach { item ->
                          val obj = JSONObject()
                          obj.put("id", item.id)
                          obj.put("name", item.name)
                          obj.put("folderName", item.folderName)
                          obj.put("sizeBytes", item.sizeBytes)
                          obj.put("mimeType", item.mimeType)
                          obj.put("webStreamPath", item.webStreamPath)
                          obj.put("vlcPath", item.vlcPath)
                          obj.put("srtPath", if (item.srtUri != null) item.srtPath else "")
                          itemsArr.put(obj)
                      }
                      root.put("items", itemsArr)
                      return newFixedLengthResponse(Response.Status.OK, "application/json", root.toString()).apply {
                          addHeader("Access-Control-Allow-Origin", "*")
                      }
                  }

                  if (uriPath.startsWith("/webstream/")) {
                      if (!checkAuth(session)) {
                          logger("AUTH", "Unauthorized stream attempt from $clientIp", true)
                          return newFixedLengthResponse(Response.Status.UNAUTHORIZED, MIME_PLAINTEXT, "Login required")
                      }
                      val segments = uriPath.removePrefix("/webstream/").split("/")
                      val itemId = segments.firstOrNull()?.toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "Media not found")
                      return serveMediaWithRange(session, media, clientIp, "HTTP/206")
                  }

                  if (uriPath.startsWith("/websrt/")) {
                      if (!checkAuth(session)) {
                          return newFixedLengthResponse(Response.Status.UNAUTHORIZED, MIME_PLAINTEXT, "Login required")
                      }
                      val itemId = uriPath.removePrefix("/websrt/").substringBefore("/").toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                      val srtUri = media?.srtUri
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "No SRT")
                      val rawSrt = resolver.openInputStream(srtUri)?.bufferedReader()?.use { it.readText() } ?: ""
                      val wantVtt = session.parameters["format"]?.firstOrNull() == "vtt"
                      return if (wantVtt) {
                          val nl = Char(10).toString()
                          val vttBody = rawSrt.lines().joinToString(separator = nl) { line ->
                              if (line.contains("-->")) line.replace(',', '.') else line
                          }
                          val vtt = "WEBVTT" + nl + nl + vttBody
                          newFixedLengthResponse(Response.Status.OK, "text/vtt; charset=utf-8", vtt)
                      } else {
                          newFixedLengthResponse(Response.Status.OK, "text/plain; charset=utf-8", rawSrt)
                      }
                  }

                  return serveAuthenticatedWebPortal()
              }

              private fun serveMediaWithRange(
                  session: IHTTPSession,
                  media: BeastMediaItem,
                  clientIp: TextVal,
                  logTag: TextVal
              ): Response {
                  val totalLength = media.sizeBytes
                  val rangeHeader = session.headers["range"]
                  try {
                      if (rangeHeader != null && rangeHeader.startsWith("bytes=") && totalLength > 0L) {
                          val rangeValue = rangeHeader.removePrefix("bytes=").trim()
                          val parts = rangeValue.split("-")
                          val startByte = parts.getOrNull(0)?.toLongOrNull() ?: 0L
                          val endByte = parts.getOrNull(1)?.takeIf { it.isNotEmpty() }?.toLongOrNull()
                              ?: (totalLength - 1L)
                          val safeEnd = endByte.coerceAtMost(totalLength - 1L)
                          if (startByte in 0 until totalLength && startByte <= safeEnd) {
                              val contentLen = (safeEnd - startByte) + 1L
                              val rawStream = resolver.openInputStream(media.uri)
                                  ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Stream open error")
                              var skipped = 0L
                              while (skipped < startByte) {
                                  val step = rawStream.skip(startByte - skipped)
                                  if (step <= 0L) break
                                  skipped += step
                              }
                              logger(logTag, "Partial Content ${media.name} ($startByte-$safeEnd) -> $clientIp", false)
                              val bounded = BoundedStream(rawStream, contentLen)
                              return newFixedLengthResponse(
                                  Response.Status.PARTIAL_CONTENT,
                                  media.mimeType,
                                  bounded,
                                  contentLen
                              ).apply {
                                  addHeader("Accept-Ranges", "bytes")
                                  addHeader("Content-Range", "bytes $startByte-$safeEnd/$totalLength")
                                  addHeader("Content-Length", contentLen.toString())
                                  addHeader("Access-Control-Allow-Origin", "*")
                              }
                          }
                      }
                      logger(logTag, "Full stream started: ${media.name} -> $clientIp", false)
                      val stream = resolver.openInputStream(media.uri)
                          ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Stream error")
                      val resp = if (totalLength > 0L) {
                          newFixedLengthResponse(Response.Status.OK, media.mimeType, stream, totalLength)
                      } else {
                          newChunkedResponse(Response.Status.OK, media.mimeType, stream)
                      }
                      resp.addHeader("Accept-Ranges", "bytes")
                      resp.addHeader("Access-Control-Allow-Origin", "*")
                      return resp
                  } catch (e: Exception) {
                      logger("ERROR", "Stream error for ${media.name}: ${e.message}", true)
                      return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Error: ${e.message}")
                  }
              }

              private fun serveAuthenticatedWebPortal(): Response {
                  val html = """
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Beast Reaming • A-Z Media Portal</title>
          <style>
            :root { --gold: #ffc107; --gold-lt: #ffe082; --bg1: #080511; --bg2: #190e30; --bg3: #2d1808; }
            * { box-sizing: border-box; }
            body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(145deg, var(--bg1), var(--bg2), var(--bg3)); color: #fff; min-height: 100vh; }
            .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
            .glass-card { background: rgba(255,255,255,0.07); backdrop-filter: blur(18px); border: 1px solid rgba(255,213,79,0.32); border-radius: 24px; padding: 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
            .brand { color: var(--gold); font-size: 26px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 6px; }
            .sub { color: #bbb; font-size: 13px; margin-bottom: 20px; }
            input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid rgba(255,213,79,0.35); background: rgba(0,0,0,0.45); color: #fff; font-size: 14px; outline: none; }
            .btn-gold { width: 100%; padding: 12px 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ffe082, #ffb300, #fb8c00); color: #1a1200; font-weight: 800; font-size: 14px; cursor: pointer; }
            .app-shell { display: none; max-width: 1100px; margin: 0 auto; padding: 20px; }
            .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding: 16px 20px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,213,79,0.25); border-radius: 20px; }
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
            .mcard { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
            .mtitle { font-weight: 700; font-size: 15px; margin: 6px 0 4px; word-break: break-word; }
