          </style>
          </head>
          <body>
          <div class="login-wrap" id="loginView">
            <div class="glass-card">
              <div class="brand">BEAST REAMING</div>
              <div class="sub">Sign in with the Host Username &amp; Password to stream A–Z</div>
              <input id="userIn" placeholder="Username" autocomplete="username"/>
              <input id="passIn" type="password" placeholder="Password" autocomplete="current-password"/>
              <button class="btn-gold" onclick="doLogin()">Log In &amp; Stream</button>
              <div id="errMsg" style="color:#ff8a80;font-size:12px;margin-top:10px;"></div>
            </div>
          </div>
          <div class="app-shell" id="libraryView">
            <div class="topbar">
              <div>
                <div class="brand" style="font-size:20px;">BEAST REAMING • A–Z LIBRARY</div>
                <div id="hostInfo" style="font-size:12px;color:#ccc;">Sorted Alphabetically (A–Z)</div>
              </div>
              <input id="searchBox" placeholder="Search A–Z files..." style="max-width:260px;margin:0;" oninput="renderGrid()"/>
            </div>
            <div class="grid" id="mediaGrid"></div>
          </div>
          <div class="overlay" id="playerModal">
            <div class="phead">
              <div>
                <span style="color:var(--gold);font-size:12px;font-weight:700;" id="queueInfo">PLAYING A–Z</span>
                <div id="nowTitle" style="font-weight:700;font-size:16px;"></div>
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn-gold" style="width:auto;padding:8px 14px;" onclick="playNextAz()">Next File (A–Z) &rsaquo;</button>
                <button class="vlc-btn" style="padding:8px 14px;border-radius:10px;cursor:pointer;" onclick="closePlayer()">Close</button>
              </div>
            </div>
            <video id="webVideo" controls autoplay></video>
          </div>
          <script>
          let authU = '', authP = '', catalog = [], currentIdx = -1;
          async function doLogin() {
            authU = document.getElementById('userIn').value.trim();
            authP = document.getElementById('passIn').value.trim();
            const res = await fetch('/api/catalog?u=' + encodeURIComponent(authU) + '&p=' + encodeURIComponent(authP));
            if (!res.ok) {
              document.getElementById('errMsg').innerText = 'Invalid username or password';
              return;
            }
            const data = await res.json();
            catalog = data.items || [];
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('libraryView').style.display = 'block';
            document.getElementById('hostInfo').innerText = data.hostName + ' • ' + catalog.length + ' Files (Sorted A–Z)';
            renderGrid();
          }
          function renderGrid() {
            const q = (document.getElementById('searchBox').value || '').toLowerCase();
            const box = document.getElementById('mediaGrid');
            box.innerHTML = '';
            catalog.forEach((item, idx) => {
              if (q && !item.name.toLowerCase().includes(q)) return;
              const vlcFull = location.origin + item.vlcPath;
              const mb = (item.sizeBytes / (1024*1024)).toFixed(1) + ' MB';
              const card = document.createElement('div');
              card.className = 'mcard';
              card.innerHTML = '<div><span class="badge">' + item.folderName + '</span>' +
                (item.srtPath ? ' <span class="badge">SRT</span>' : '') +
                '<div class="mtitle">' + item.name + '</div>' +
                '<div class="mmeta">' + mb + ' • ' + item.mimeType + '</div></div>' +
                '<div class="actions"><button class="play-btn" onclick="openPlayer(' + idx + ')">&#9654; Play Fullscreen</button>' +
                '<button class="vlc-btn" onclick="copyVlcUrl(' + idx + ', this)">Copy VLC Link</button></div>';
              box.appendChild(card);
            });
          }
          function copyVlcUrl(idx, btn) { const item = catalog[idx]; if (!item) return; navigator.clipboard.writeText(location.origin + item.vlcPath); btn.innerText = 'Copied!'; }
          function openPlayer(idx) {
            currentIdx = idx;
            const item = catalog[idx];
            if (!item) return;
            const modal = document.getElementById('playerModal');
            const vid = document.getElementById('webVideo');
            modal.style.display = 'flex';
            document.getElementById('nowTitle').innerText = item.name;
            document.getElementById('queueInfo').innerText = 'PLAYING A–Z (' + (idx + 1) + ' OF ' + catalog.length + ')';
            vid.innerHTML = '';
            vid.src = item.webStreamPath + '?u=' + encodeURIComponent(authU) + '&p=' + encodeURIComponent(authP);
            if (item.srtPath) {
              const tr = document.createElement('track');
              tr.kind = 'subtitles'; tr.label = 'Subtitles'; tr.srclang = 'en'; tr.default = true;
              tr.src = item.srtPath + '?format=vtt&u=' + encodeURIComponent(authU) + '&p=' + encodeURIComponent(authP);
              vid.appendChild(tr);
            }
            vid.onended = () => playNextAz();
            vid.play();
          }
          function playNextAz() {
            if (catalog.length === 0) return;
            openPlayer((currentIdx + 1) % catalog.length);
          }
          function closePlayer() {
            const vid = document.getElementById('webVideo');
            vid.pause(); vid.src = '';
            document.getElementById('playerModal').style.display = 'none';
          }
          </script>
          </body>
          </html>
                  """.trimIndent()
                  return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html)
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          BeastReamingApp()
                      }
                  }
              }
          }

          fun resolveDeviceLanIp(context: Context): TextVal {
              try {
                  val interfaces = NetworkInterface.getNetworkInterfaces()
                  while (interfaces.hasMoreElements()) {
                      val intf = interfaces.nextElement()
                      if (!intf.isUp || intf.isLoopback) continue
                      val addrs = intf.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val addr = addrs.nextElement()
                          if (addr is Inet4Address && !addr.isLoopbackAddress) {
                              val ip = addr.hostAddress ?: continue
                              if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                  return ip
                              }
                          }
                      }
                  }
                  val wifiMgr = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                  val ipInt = wifiMgr?.connectionInfo?.ipAddress ?: 0
                  if (ipInt != 0) {
                      return String.format(
                          Locale.US,
                          "%d.%d.%d.%d",
                          ipInt and 0xff,
                          ipInt shr 8 and 0xff,
                          ipInt shr 16 and 0xff,
                          ipInt shr 24 and 0xff
                      )
                  }
              } catch (_: Exception) {}
              return "192.168.43.1"
          }

          fun scanSelectedFoldersAlphabetical(context: Context, uriStrings: List<TextVal>): BeastScanResult {
              val slots = mutableListOf<BeastFolderSlot>()
              val rawMedia = mutableListOf<BeastMediaItem>()
              val srtMap = HashMap<TextVal, Uri>()
              val pendingFiles = mutableListOf<BeastDocNode>()

              fun walkNode(node: DocumentFile, folderLabel: TextVal, depth: Int) {
                  if (depth > 3) return
                  val children = try { node.listFiles() } catch (_: Exception) { emptyArray() }
                  for (child in children) {
                      if (child.isDirectory) {
                          walkNode(child, folderLabel, depth + 1)
                      } else if (child.isFile) {
                          val fname = child.name ?: continue
                          val baseKey = folderLabel + "/" + fname.substringBeforeLast(".")
                          if (fname.lowercase(Locale.ROOT).endsWith(".srt")) {
                              srtMap[baseKey.lowercase(Locale.ROOT)] = child.uri
                          } else {
                              pendingFiles.add(BeastDocNode(child, fname, folderLabel))
                          }
                      }
                  }
              }

              for ((idx, rawUri) in uriStrings.take(3).withIndex()) {
                  val parsed = Uri.parse(rawUri)
                  val rootDoc = DocumentFile.fromTreeUri(context, parsed)
                  if (rootDoc != null && rootDoc.exists()) {
                      val label = rootDoc.name ?: "Folder ${idx + 1}"
                      val before = pendingFiles.size
                      walkNode(rootDoc, label, 0)
                      slots.add(BeastFolderSlot(rawUri, label, pendingFiles.size - before))
                  }
              }

              val sortedPending = pendingFiles.sortedBy { it.fileName.lowercase(Locale.ROOT) }
              var nextId = 1
              for ((doc, fileName, folderLabel) in sortedPending) {
                  val mime = doc.type ?: guessMimeFromName(fileName)
                  val safeUrlName = URLEncoder.encode(fileName, "UTF-8").replace("+", "%20")
                  val baseKey = (folderLabel + "/" + fileName.substringBeforeLast(".")).lowercase(Locale.ROOT)
                  val matchedSrt = srtMap[baseKey]
                  rawMedia.add(
                      BeastMediaItem(
                          id = nextId,
                          name = fileName,
                          folderName = folderLabel,
                          sizeBytes = doc.length(),
                          mimeType = mime,
                          uri = doc.uri,
                          srtUri = matchedSrt,
                          vlcPath = "/vlc/$nextId/$safeUrlName",
                          webStreamPath = "/webstream/$nextId/$safeUrlName",
                          srtPath = "/websrt/$nextId/sub.srt"
                      )
                  )
                  nextId++
              }
              return BeastScanResult(slots, rawMedia)
          }

          fun guessMimeFromName(name: TextVal): TextVal {
              val lower = name.lowercase(Locale.ROOT)
              return when {
                  lower.endsWith(".mp4") || lower.endsWith(".m4v") -> "video/mp4"
                  lower.endsWith(".mkv") -> "video/x-matroska"
                  lower.endsWith(".webm") -> "video/webm"
                  lower.endsWith(".avi") -> "video/x-msvideo"
                  lower.endsWith(".mov") -> "video/quicktime"
                  lower.endsWith(".mp3") -> "audio/mpeg"
                  lower.endsWith(".flac") -> "audio/flac"
                  lower.endsWith(".wav") -> "audio/wav"
                  else -> "application/octet-stream"
              }
          }

          fun formatByteSize(bytes: Long): TextVal {
              val mb = bytes.toDouble() / (1024.0 * 1024.0)
              return if (mb >= 1024.0) {
                  String.format(Locale.US, "%.2f GB", mb / 1024.0)
              } else if (mb >= 1.0) {
                  String.format(Locale.US, "%.1f MB", mb)
              } else {
                  String.format(Locale.US, "%d KB", (bytes / 1024L).coerceAtLeast(1L))
              }
          }

          fun formatDurationMs(ms: Int): TextVal {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val mins = totalSec / 60
              val secs = totalSec % 60
              return String.format(Locale.US, "%02d:%02d", mins, secs)
          }

          fun parseSrtContent(raw: TextVal): List<BeastSubtitleCue> {
              val cues = mutableListOf<BeastSubtitleCue>()
              val currentBlock = mutableListOf<TextVal>()
              fun flushBlock() {
                  val timeIdx = currentBlock.indexOfFirst { it.contains("-->") }
                  if (timeIdx != -1 && timeIdx + 1 < currentBlock.size) {
                      val parts = currentBlock[timeIdx].split("-->")
                      if (parts.size == 2) {
                          val start = parseSrtTimestamp(parts[0].trim())
                          val end = parseSrtTimestamp(parts[1].trim())
                          val text = currentBlock.subList(timeIdx + 1, currentBlock.size).joinToString(" ")
                          cues.add(BeastSubtitleCue(start, end, text))
                      }
                  }
                  currentBlock.clear()
              }
              for (rawLine in raw.lines()) {
                  val trimmed = rawLine.trim()
                  if (trimmed.isEmpty()) {
                      if (currentBlock.isNotEmpty()) flushBlock()
                  } else {
                      currentBlock.add(trimmed)
                  }
              }
              if (currentBlock.isNotEmpty()) flushBlock()
              return cues
          }

          fun parseSrtTimestamp(ts: TextVal): Long {
              return try {
                  val clean = ts.replace(",", ".").trim()
                  val p = clean.split(":")
                  val h = p[0].toLong()
                  val m = p[1].toLong()
                  val secParts = p[2].split(".")
                  val s = secParts[0].toLong()
                  val ms = secParts.getOrNull(1)?.padEnd(3, '0')?.take(3)?.toLong() ?: 0L
                  ((h * 3600L + m * 60L + s) * 1000L) + ms
              } catch (_: Exception) {
                  0L
              }
          }

          fun copyTextToClipboard(context: Context, label: TextVal, value: TextVal) {
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText(label, value))
              Toast.makeText(context, "Copied: $value", Toast.LENGTH_SHORT).show()
          }

          @Composable
          fun HollowLionEmblem(modifier: Modifier = Modifier) {
              val goldenBrush = Brush.linearGradient(
                  colors = listOf(Color(0xFFFFF59D), Color(0xFFFFCA28), Color(0xFFFF8F00))
              )
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(goldenBrush)
                      .border(1.2.dp, Color.White.copy(alpha = 0.5f), RoundedCornerShape(14.dp)),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize().padding(6.dp)) {
                      val w = size.width
                      val h = size.height
                      val strokeStyle = Stroke(width = w * 0.07f, cap = StrokeCap.Round, join = StrokeJoin.Round)
                      val lionPath = Path().apply {
                          moveTo(w * 0.50f, h * 0.08f)
                          lineTo(w * 0.78f, h * 0.18f)
                          lineTo(w * 0.92f, h * 0.42f)
                          lineTo(w * 0.85f, h * 0.70f)
                          lineTo(w * 0.68f, h * 0.88f)
                          lineTo(w * 0.50f, h * 0.95f)
                          lineTo(w * 0.32f, h * 0.88f)
                          lineTo(w * 0.15f, h * 0.70f)
                          lineTo(w * 0.08f, h * 0.42f)
                          lineTo(w * 0.22f, h * 0.18f)
                          close()
                          moveTo(w * 0.26f, h * 0.38f)
                          lineTo(w * 0.42f, h * 0.44f)
                          lineTo(w * 0.50f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.44f)
                          lineTo(w * 0.74f, h * 0.38f)
                          moveTo(w * 0.42f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.62f)
                          lineTo(w * 0.50f, h * 0.72f)
                          close()
                          moveTo(w * 0.50f, h * 0.72f)
                          lineTo(w * 0.38f, h * 0.80f)
                          lineTo(w * 0.50f, h * 0.88f)
                          lineTo(w * 0.62f, h * 0.80f)
                          lineTo(w * 0.50f, h * 0.72f)
                      }
                      drawPath(path = lionPath, color = Color(0xFF1A1200), style = strokeStyle)
                  }
              }
          }

          @Composable
          fun QrMatrixBox(payload: TextVal, modifier: Modifier = Modifier) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(Color(0xFF1A1200))
                      .border(1.5.dp, Color(0xFFFFD54F), RoundedCornerShape(14.dp))
                      .padding(8.dp)
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val grid = 15
                      val cell = size.width / grid.toFloat()
                      val gold = Color(0xFFFFD54F)
                      val hash = payload.hashCode()
                      for (r in 0 until grid) {
                          for (c in 0 until grid) {
                              val isCorner = (r < 4 && c < 4) || (r < 4 && c >= grid - 4) || (r >= grid - 4 && c < 4)
                              val isCornerBorder = isCorner && (r == 0 || r == 3 || c == 0 || c == 3 || r == grid - 1 || r == grid - 4 || c == grid - 1 || c == grid - 4)
                              val isCornerCenter = (r in 1..2 && c in 1..2) || (r in 1..2 && c in (grid - 3)..(grid - 2)) || (r in (grid - 3)..(grid - 2) && c in 1..2)
                              val bit = ((hash shr ((r * 7 + c * 13) % 28)) xor (r * 31 + c * 17)) and 1 == 1
                              val drawCell = if (isCorner) (isCornerBorder || isCornerCenter) else bit
                              if (drawCell) {
                                  drawRect(
                                      color = gold,
                                      topLeft = Offset(c * cell, r * cell),
                                      size = Size(cell * 0.88f, cell * 0.88f)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiquidGlassSectionCard(
              modifier: Modifier = Modifier,
              goldBorder: Boolean = false,
              content: @Composable ColumnScope.() -> Unit
          ) {
              val borderBrush = if (goldBorder) {
                  Brush.linearGradient(
                      listOf(
                          Color(0xFFFFD54F).copy(alpha = 0.65f),
                          Color(0xFFB388FF).copy(alpha = 0.30f),
                          Color.White.copy(alpha = 0.14f)
                      )
                  )
              } else {
                  Brush.linearGradient(
                      listOf(Color.White.copy(alpha = 0.22f), Color.White.copy(alpha = 0.06f))
                  )
              }
              val fillBrush = Brush.linearGradient(
                  listOf(Color.White.copy(alpha = 0.10f), Color.White.copy(alpha = 0.04f))
              )
              Column(
                  modifier = modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(22.dp))
                      .background(fillBrush)
                      .border(1.dp, borderBrush, RoundedCornerShape(22.dp))
                      .padding(14.dp),
                  content = content
              )
          }

          @Composable
          fun BeastReamingApp() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { context.getSharedPreferences("beast_reaming_v2_prefs", Context.MODE_PRIVATE) }

              // Dock Tab: 0 = Home, 1 = Files (Netflix/Jellyfin A-Z), 2 = Logs
              var selectedDockTab by remember { mutableStateOf(0) }

              // Master Server Power + Separated Hosting Modes
              var isServerPoweredOn by remember { mutableStateOf(true) }
              var hostOnWebAndApp by remember { mutableStateOf(prefs.getBoolean("host_web_app", true)) }
              var hostOnVlc by remember { mutableStateOf(prefs.getBoolean("host_vlc", true)) }

              // Host User Management Credentials
              var hostUsername by remember { mutableStateOf(prefs.getString("host_user", "beast") ?: "beast") }
              var hostPassword by remember { mutableStateOf(prefs.getString("host_pass", "1234") ?: "1234") }
              var showHostPass by remember { mutableStateOf(false) }

              // Up to 3 Managed Folders
              var savedUriStrings by remember {
                  val raw = prefs.getString("folder_uris", "") ?: ""
                  mutableStateOf(if (raw.isBlank()) emptyList() else raw.split("|").filter { it.isNotBlank() }.take(3))
              }
              var folderSlots by remember { mutableStateOf(emptyList<BeastFolderSlot>()) }
              var hostedItems by remember { mutableStateOf(emptyList<BeastMediaItem>()) }

              var localIp by remember { mutableStateOf(resolveDeviceLanIp(context)) }
              val serverPort = 8080

              // Receive Mode State (Login to another Android host)
              var isReceiveEnabled by remember { mutableStateOf(true) }
              var remoteHostIp by remember { mutableStateOf(prefs.getString("remote_ip", "") ?: "") }
              var remoteHostPort by remember { mutableStateOf(prefs.getString("remote_port", "8080") ?: "8080") }
              var remoteUsername by remember { mutableStateOf(prefs.getString("remote_user", "beast") ?: "beast") }
              var remotePassword by remember { mutableStateOf(prefs.getString("remote_pass", "1234") ?: "1234") }
              var remoteStatusMsg by remember { mutableStateOf("Enter Host IP, Username & Password to log in") }
              var isConnectingRemote by remember { mutableStateOf(false) }
              var remoteCatalog by remember { mutableStateOf(emptyList<BeastRemoteItem>()) }
              var remoteFolders by remember { mutableStateOf(emptyList<TextVal>()) }

              // Files Tab State (0 = Hosted A-Z, 1 = Received A-Z)
              var filesSourceMode by remember { mutableStateOf(0) }
              var selectedFolderFilter by remember { mutableStateOf("All") }
              var searchQuery by remember { mutableStateOf("") }

              // Logs Tab State (Capped ring buffer for low-spec device performance)
              var logsList by remember { mutableStateOf(emptyList<BeastLogEntry>()) }
              var pauseLogs by remember { mutableStateOf(false) }
              var logFilterErrorsOnly by remember { mutableStateOf(false) }

              // Fullscreen Netflix-Style Alphabetical Player State
              var isFullscreenPlayerOpen by remember { mutableStateOf(false) }
              var playerQueueTitles by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerQueueUrls by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerQueueSrtUrls by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerCurrentIndex by remember { mutableStateOf(0) }

              fun appendLog(tag: TextVal, message: TextVal, isError: Boolean = false) {
                  if (pauseLogs) return
                  val stamp = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  val entry = BeastLogEntry(System.nanoTime(), stamp, tag, message, isError)
                  scope.launch(Dispatchers.Main) {
                      logsList = (listOf(entry) + logsList).take(120)
                  }
              }

              fun saveFoldersAndRescan(updated: List<TextVal>) {
                  val capped = updated.distinct().take(3)
                  savedUriStrings = capped
                  prefs.edit().putString("folder_uris", capped.joinToString("|")).apply()
                  scope.launch(Dispatchers.IO) {
                      val scanRes = scanSelectedFoldersAlphabetical(context, capped)
                      withContext(Dispatchers.Main) {
                          folderSlots = scanRes.slots
                          hostedItems = scanRes.items
                          localIp = resolveDeviceLanIp(context)
                          appendLog("SYSTEM", "Indexed ${scanRes.items.size} files (A–Z) across ${scanRes.slots.size}/3 folders", false)
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  appendLog("SYSTEM", "Beast Reaming initialized on ${Build.MODEL}", false)
                  saveFoldersAndRescan(savedUriStrings)
              }

              DisposableEffect(isServerPoweredOn) {
                  var server: BeastHttpServer? = null
                  if (isServerPoweredOn) {
                      try {
                          server = BeastHttpServer(
                              resolver = context.contentResolver,
                              port = serverPort,
                              webAppEnabledProvider = { hostOnWebAndApp },
                              vlcEnabledProvider = { hostOnVlc },
                              credentialsProvider = { BeastAuthPair(hostUsername.trim(), hostPassword.trim()) },
                              catalogProvider = { hostedItems },
                              folderNamesProvider = { folderSlots.map { it.displayName } },
                              logger = { tag, msg, err -> appendLog(tag, msg, err) }
                          )
                          server.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                          localIp = resolveDeviceLanIp(context)
                          appendLog("SYSTEM", "Server ONLINE at http://$localIp:$serverPort (Web/App=$hostOnWebAndApp, VLC=$hostOnVlc)", false)
                      } catch (e: Exception) {
                          appendLog("ERROR", "Server start failed: ${e.message}", true)
