                                          ) {
                                              Text(
                                                  text = title,
                                                  color = if (active) Color(0xFF1A1200) else Color.White.copy(alpha = 0.8f),
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 12.sp
                                              )
                                          }
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(8.dp))

                                  OutlinedTextField(
                                      value = searchQuery,
                                      onValueChange = { searchQuery = it },
                                      placeholder = { Text("Search A–Z library...", color = Color.White.copy(alpha = 0.5f)) },
                                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = Color(0xFFFFD54F)) },
                                      trailingIcon = {
                                          Text("A–Z", color = Color(0xFFFFD54F), fontWeight = FontWeight.ExtraBold, fontSize = 12.sp, modifier = Modifier.padding(end = 10.dp))
                                      },
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth(),
                                      shape = RoundedCornerShape(14.dp)
                                  )

                                  val availableFolders = if (filesSourceMode == 0) folderSlots.map { it.displayName } else remoteFolders
                                  if (availableFolders.isNotEmpty()) {
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .horizontalScroll(rememberScrollState()),
                                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          (listOf("All") + availableFolders).forEach { fName ->
                                              FilterChip(
                                                  selected = selectedFolderFilter == fName,
                                                  onClick = { selectedFolderFilter = fName },
                                                  label = { Text(fName, fontSize = 12.sp) }
                                              )
                                          }
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(8.dp))

                                  if (filesSourceMode == 0) {
                                      val filteredHosted = hostedItems
                                          .filter { (selectedFolderFilter == "All" || it.folderName == selectedFolderFilter) && (searchQuery.isBlank() || it.name.contains(searchQuery, ignoreCase = true)) }
                                          .sortedBy { it.name.lowercase(Locale.ROOT) }

                                      val uEnc = URLEncoder.encode(hostUsername, "UTF-8")
                                      val pEnc = URLEncoder.encode(hostPassword, "UTF-8")
                                      val allTitles = filteredHosted.map { it.name }
                                      val allPlayUrls = filteredHosted.map { "http://$localIp:$serverPort${it.webStreamPath}?u=$uEnc&p=$pEnc" }
                                      val allSrtUrls = filteredHosted.map {
                                          if (it.srtUri != null) "http://$localIp:$serverPort${it.srtPath}?u=$uEnc&p=$pEnc" else ""
                                      }

                                      LazyColumn(
                                          modifier = Modifier.fillMaxSize(),
                                          verticalArrangement = Arrangement.spacedBy(10.dp),
                                          contentPadding = PaddingValues(bottom = 24.dp)
                                      ) {
                                          itemsIndexed(filteredHosted, key = { _, item -> item.id }) { idx, media ->
                                              val directVlcLink = "http://$localIp:$serverPort${media.vlcPath}"
                                              NetflixMediaCard(
                                                  indexNumber = idx + 1,
                                                  title = media.name,
                                                  folderName = media.folderName,
                                                  sizeText = formatByteSize(media.sizeBytes),
                                                  mimeType = media.mimeType,
                                                  hasSrt = media.srtUri != null,
                                                  vlcUrl = directVlcLink,
                                                  onPlayFullscreen = {
                                                      launchAlphabeticalFullscreenPlayer(allTitles, allPlayUrls, allSrtUrls, idx)
                                                  },
                                                  onCopyVlc = {
                                                      copyTextToClipboard(context, "VLC Stream Link", directVlcLink)
                                                  }
                                              )
                                          }
                                      }
                                  } else {
                                      val filteredRemote = remoteCatalog
                                          .filter { (selectedFolderFilter == "All" || it.folderName == selectedFolderFilter) && (searchQuery.isBlank() || it.name.contains(searchQuery, ignoreCase = true)) }
                                          .sortedBy { it.name.lowercase(Locale.ROOT) }

                                      val allTitles = filteredRemote.map { it.name }
                                      val allPlayUrls = filteredRemote.map { it.streamUrl }
                                      val allSrtUrls = filteredRemote.map { it.srtUrl }

                                      LazyColumn(
                                          modifier = Modifier.fillMaxSize(),
                                          verticalArrangement = Arrangement.spacedBy(10.dp),
                                          contentPadding = PaddingValues(bottom = 24.dp)
                                      ) {
                                          itemsIndexed(filteredRemote, key = { _, item -> item.id }) { idx, rMedia ->
                                              NetflixMediaCard(
                                                  indexNumber = idx + 1,
                                                  title = rMedia.name,
                                                  folderName = rMedia.folderName,
                                                  sizeText = formatByteSize(rMedia.sizeBytes),
                                                  mimeType = rMedia.mimeType,
                                                  hasSrt = rMedia.srtUrl.isNotEmpty(),
                                                  vlcUrl = rMedia.vlcUrl,
                                                  onPlayFullscreen = {
                                                      launchAlphabeticalFullscreenPlayer(allTitles, allPlayUrls, allSrtUrls, idx)
                                                  },
                                                  onCopyVlc = {
                                                      copyTextToClipboard(context, "Remote VLC Link", rMedia.vlcUrl)
                                                  }
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          // SECTION 2: LOGS (REAL-TIME SERVER, AUTH & STREAMING CONSOLE)
                          if (selectedDockTab == 2) {
                              Column(modifier = Modifier.fillMaxSize()) {
                                  LiquidGlassSectionCard(goldBorder = true) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              FilterChip(
                                                  selected = !logFilterErrorsOnly,
                                                  onClick = { logFilterErrorsOnly = false },
                                                  label = { Text("All Logs (${logsList.size})", fontSize = 12.sp) }
                                              )
                                              Spacer(modifier = Modifier.width(8.dp))
                                              FilterChip(
                                                  selected = logFilterErrorsOnly,
                                                  onClick = { logFilterErrorsOnly = true },
                                                  label = { Text("Errors & Blocks", fontSize = 12.sp) }
                                              )
                                          }
                                          Row {
                                              TextButton(onClick = { pauseLogs = !pauseLogs }) {
                                                  Text(if (pauseLogs) "Resume" else "Pause", color = Color(0xFFFFD54F), fontSize = 12.sp)
                                              }
                                              TextButton(onClick = { logsList = emptyList() }) {
                                                  Text("Clear", color = Color(0xFFFF8A80), fontSize = 12.sp)
                                              }
                                          }
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(10.dp))

                                  val shownLogs = if (logFilterErrorsOnly) logsList.filter { it.isError } else logsList
                                  LazyColumn(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .clip(RoundedCornerShape(18.dp))
                                          .background(Color.Black.copy(alpha = 0.50f))
                                          .border(1.dp, Color(0xFFFFD54F).copy(alpha = 0.25f), RoundedCornerShape(18.dp))
                                          .padding(12.dp),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      items(shownLogs, key = { it.id }) { entry ->
                                          Row(modifier = Modifier.fillMaxWidth()) {
                                              Text(
                                                  text = "${entry.timeText} [${entry.tag}] ",
                                                  color = if (entry.isError) Color(0xFFFF8A80) else Color(0xFFFFD54F),
                                                  fontFamily = FontFamily.Monospace,
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 11.sp
                                              )
                                              Text(
                                                  text = entry.message,
                                                  color = Color.White.copy(alpha = 0.88f),
                                                  fontFamily = FontFamily.Monospace,
                                                  fontSize = 11.sp
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              // FULL-SCREEN NETFLIX-STYLE VIDEO PLAYER DIALOG WITH ALPHABETICAL AUTO-PLAY & SRT SUBTITLES
              if (isFullscreenPlayerOpen && playerQueueUrls.isNotEmpty()) {
                  val safeIdx = playerCurrentIndex.coerceIn(0, playerQueueUrls.size - 1)
                  val currentTitle = playerQueueTitles.getOrElse(safeIdx) { "Stream" }
                  val currentUrl = playerQueueUrls[safeIdx]
                  val currentSrtUrl = playerQueueSrtUrls.getOrElse(safeIdx) { "" }

                  NetflixFullscreenPlayerDialog(
                      title = currentTitle,
                      streamUrl = currentUrl,
                      srtUrl = currentSrtUrl,
                      queuePositionText = "PLAYING A–Z (${safeIdx + 1} OF ${playerQueueUrls.size})",
                      onPrevious = {
                          playerCurrentIndex = if (safeIdx - 1 >= 0) safeIdx - 1 else playerQueueUrls.size - 1
                      },
                      onNextAlphabetical = {
                          playerCurrentIndex = (safeIdx + 1) % playerQueueUrls.size
                      },
                      onDismiss = {
                          isFullscreenPlayerOpen = false
                      }
                  )
              }
          }

          @Composable
          fun NetflixMediaCard(
              indexNumber: Int,
              title: TextVal,
              folderName: TextVal,
              sizeText: TextVal,
              mimeType: TextVal,
              hasSrt: Boolean,
              vlcUrl: TextVal,
              onPlayFullscreen: () -> Unit,
              onCopyVlc: () -> Unit
          ) {
              val posterBrush = Brush.linearGradient(
                  colors = listOf(Color(0xFF311B47), Color(0xFF1A0E2E), Color(0xFF4A2C0A))
              )
              LiquidGlassSectionCard {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      // Netflix/Jellyfin Poster Thumbnail Box
                      Box(
                          modifier = Modifier
                              .width(68.dp)
                              .height(92.dp)
                              .clip(RoundedCornerShape(14.dp))
                              .background(posterBrush)
                              .border(1.dp, Color(0xFFFFD54F).copy(alpha = 0.4f), RoundedCornerShape(14.dp))
                              .clickable { onPlayFullscreen() },
                          contentAlignment = Alignment.Center
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  text = "#$indexNumber",
                                  color = Color(0xFFFFD54F),
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.ExtraBold
                              )
                              Spacer(modifier = Modifier.height(4.dp))
                              Icon(
                                  imageVector = Icons.Default.PlayCircleFilled,
                                  contentDescription = "Play",
                                  tint = Color(0xFFFFE082),
                                  modifier = Modifier.size(30.dp)
                              )
                          }
                      }

                      Spacer(modifier = Modifier.width(12.dp))

                      Column(modifier = Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text(
                                  text = folderName,
                                  color = Color(0xFFFFE082),
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(6.dp))
                                      .background(Color(0xFFFFC107).copy(alpha = 0.18f))
                                      .padding(horizontal = 6.dp, vertical = 2.dp)
                              )
                              if (hasSrt) {
                                  Text(
                                      text = "CC • SRT",
                                      color = Color(0xFF80D8FF),
                                      fontSize = 10.sp,
                                      fontWeight = FontWeight.Bold,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(6.dp))
                                          .background(Color(0xFF40C4FF).copy(alpha = 0.18f))
                                          .padding(horizontal = 6.dp, vertical = 2.dp)
                                  )
                              }
                          }
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = title,
                              color = Color.White,
                              fontWeight = FontWeight.Bold,
                              fontSize = 14.sp,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              text = "$sizeText • $mimeType",
                              color = Color.White.copy(alpha = 0.62f),
                              fontSize = 11.sp
                          )
                          Spacer(modifier = Modifier.height(8.dp))
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Button(
                                  onClick = onPlayFullscreen,
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107), contentColor = Color(0xFF1A1200)),
                                  shape = RoundedCornerShape(10.dp),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 6.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Icon(Icons.Default.PlayArrow, contentDescription = null, modifier = Modifier.size(16.dp))
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("Play Fullscreen", fontWeight = FontWeight.Bold, fontSize = 11.sp)
                              }
                              OutlinedButton(
                                  onClick = onCopyVlc,
                                  shape = RoundedCornerShape(10.dp),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 6.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Icon(Icons.Default.ContentCopy, contentDescription = null, tint = Color(0xFFFFD54F), modifier = Modifier.size(14.dp))
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("Copy VLC Link", color = Color.White, fontSize = 11.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NetflixFullscreenPlayerDialog(
              title: TextVal,
              streamUrl: TextVal,
              srtUrl: TextVal,
              queuePositionText: TextVal,
              onPrevious: () -> Unit,
              onNextAlphabetical: () -> Unit,
              onDismiss: () -> Unit
          ) {
              val videoHolder = remember { BeastVideoHolder() }
              var isVideoActive by remember { mutableStateOf(true) }
              var showControlsOverlay by remember { mutableStateOf(true) }
              var currentPosMs by remember { mutableStateOf(0) }
              var durationMs by remember { mutableStateOf(1) }
              var subtitlesEnabled by remember { mutableStateOf(true) }
              var parsedCues by remember { mutableStateOf(emptyList<BeastSubtitleCue>()) }
              var currentSubtitleLine by remember { mutableStateOf("") }

              LaunchedEffect(srtUrl) {
                  parsedCues = emptyList()
                  currentSubtitleLine = ""
                  if (srtUrl.isNotEmpty()) {
                      withContext(Dispatchers.IO) {
                          try {
                              val text = URL(srtUrl).openStream().bufferedReader().use { it.readText() }
                              parsedCues = parseSrtContent(text)
                          } catch (_: Exception) {}
                      }
                  }
              }

              LaunchedEffect(streamUrl) {
                  while (true) {
                      val vv = videoHolder.view
                      if (vv != null) {
                          try {
                              if (vv.isPlaying) {
                                  currentPosMs = vv.currentPosition
                                  durationMs = vv.duration.coerceAtLeast(1)
                                  isVideoActive = true
                                  if (subtitlesEnabled && parsedCues.isNotEmpty()) {
                                      val activeCue = parsedCues.find { currentPosMs.toLong() in it.startMs..it.endMs }
                                      currentSubtitleLine = activeCue?.text ?: ""
                                  } else {
                                      currentSubtitleLine = ""
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      delay(350L)
                  }
              }

              Dialog(
                  onDismissRequest = onDismiss,
                  properties = DialogProperties(
                      usePlatformDefaultWidth = false
                  )
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .clickable { showControlsOverlay = !showControlsOverlay }
                  ) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              VideoView(ctx).apply {
                                  videoHolder.view = this
                                  setVideoURI(Uri.parse(streamUrl))
                                  setOnPreparedListener { mp ->
                                      durationMs = mp.duration.coerceAtLeast(1)
                                      mp.start()
                                      isVideoActive = true
                                  }
                                  setOnCompletionListener {
                                      onNextAlphabetical()
                                  }
                              }
                          },
                          update = { view ->
                              videoHolder.view = view
                              if (view.tag != streamUrl) {
                                  view.tag = streamUrl
                                  view.setVideoURI(Uri.parse(streamUrl))
                                  view.start()
                                  isVideoActive = true
                              }
                          }
                      )

                      // Live SRT Subtitle Overlay Box
                      if (subtitlesEnabled && currentSubtitleLine.isNotEmpty()) {
                          Box(
                              modifier = Modifier
                                  .align(Alignment.BottomCenter)
                                  .padding(bottom = if (showControlsOverlay) 96.dp else 28.dp, start = 24.dp, end = 24.dp)
                                  .clip(RoundedCornerShape(8.dp))
                                  .background(Color.Black.copy(alpha = 0.75f))
                                  .padding(horizontal = 14.dp, vertical = 6.dp)
                          ) {
                              Text(
                                  text = currentSubtitleLine,
                                  color = Color(0xFFFFF59D),
                                  fontSize = 15.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      // Netflix-Style Minimalist Dark Glass Overlay Controls
                      AnimatedVisibility(
                          visible = showControlsOverlay,
                          modifier = Modifier.fillMaxSize()
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .background(Color.Black.copy(alpha = 0.48f))
                                  .padding(18.dp)
                          ) {
                              // Top Bar: Back Button + Title + Alphabetical Queue Status + Subtitle Toggle
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .align(Alignment.TopCenter),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  IconButton(
                                      onClick = onDismiss,
                                      modifier = Modifier
                                          .clip(CircleShape)
                                          .background(Color.Black.copy(alpha = 0.55f))
                                  ) {
                                      Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                                  }
                                  Column(
                                      modifier = Modifier.weight(1f).padding(horizontal = 12.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally
                                  ) {
                                      Text(
                                          text = queuePositionText,
                                          color = Color(0xFFFFD54F),
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.ExtraBold,
                                          letterSpacing = 1.sp
                                      )
                                      Text(
                                          text = title,
                                          color = Color.White,
                                          fontSize = 15.sp,
                                          fontWeight = FontWeight.Bold,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                                  IconButton(
                                      onClick = { subtitlesEnabled = !subtitlesEnabled },
                                      modifier = Modifier
                                          .clip(CircleShape)
                                          .background(if (subtitlesEnabled) Color(0xFFFFC107).copy(alpha = 0.28f) else Color.Black.copy(alpha = 0.55f))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Subtitles,
                                          contentDescription = "Subtitles",
                                          tint = if (subtitlesEnabled) Color(0xFFFFD54F) else Color.White
                                      )
                                  }
                              }

                              // Center Netflix Transport Controls (-10s | Play/Pause | +10s)
                              Row(
                                  modifier = Modifier.align(Alignment.Center),
                                  horizontalArrangement = Arrangement.spacedBy(28.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  IconButton(
                                      onClick = {
                                          videoHolder.view?.let { vv ->
                                              val target = (vv.currentPosition - 10000).coerceAtLeast(0)
                                              vv.seekTo(target)
                                              currentPosMs = target
                                          }
                                      },
                                      modifier = Modifier
                                          .size(54.dp)
                                          .clip(CircleShape)
                                          .background(Color.White.copy(alpha = 0.14f))
                                          .border(1.dp, Color(0xFFFFD54F).copy(alpha = 0.5f), CircleShape)
                                  ) {
                                      Icon(Icons.Default.Replay10, contentDescription = "Rewind 10s", tint = Color.White, modifier = Modifier.size(28.dp))
                                  }

                                  IconButton(
                                      onClick = {
                                          videoHolder.view?.let { vv ->
                                              if (vv.isPlaying) {
                                                  vv.pause()
                                                  isVideoActive = false
                                              } else {
                                                  vv.start()
                                                  isVideoActive = true
                                              }
                                          }
                                      },
                                      modifier = Modifier
                                          .size(72.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFFFFC107))
                                  ) {
                                      Icon(
                                          imageVector = if (isVideoActive) Icons.Default.Pause else Icons.Default.PlayArrow,
                                          contentDescription = "Play/Pause",
                                          tint = Color(0xFF1A1200),
                                          modifier = Modifier.size(38.dp)
                                      )
                                  }

                                  IconButton(
                                      onClick = {
                                          videoHolder.view?.let { vv ->
                                              val target = (vv.currentPosition + 10000).coerceAtMost(durationMs)
                                              vv.seekTo(target)
                                              currentPosMs = target
                                          }
                                      },
                                      modifier = Modifier
                                          .size(54.dp)
                                          .clip(CircleShape)
                                          .background(Color.White.copy(alpha = 0.14f))
                                          .border(1.dp, Color(0xFFFFD54F).copy(alpha = 0.5f), CircleShape)
                                  ) {
                                      Icon(Icons.Default.Forward10, contentDescription = "Forward 10s", tint = Color.White, modifier = Modifier.size(28.dp))
                                  }
                              }

                              // Bottom Scrubber Bar + Prev / Next Alphabetical File Jump
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .align(Alignment.BottomCenter)
                              ) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(formatDurationMs(currentPosMs), color = Color.White, fontSize = 12.sp, fontFamily = FontFamily.Monospace)
                                      Slider(
                                          value = currentPosMs.toFloat(),
                                          onValueChange = { newVal ->
                                              currentPosMs = newVal.toInt()
                                              videoHolder.view?.seekTo(currentPosMs)
                                          },
                                          valueRange = 0f..durationMs.toFloat().coerceAtLeast(1f),
                                          colors = SliderDefaults.colors(
                                              thumbColor = Color(0xFFFFC107),
                                              activeTrackColor = Color(0xFFE53935),
                                              inactiveTrackColor = Color.White.copy(alpha = 0.3f)
                                          ),
                                          modifier = Modifier.weight(1f).padding(horizontal = 10.dp)
                                      )
                                      Text(formatDurationMs(durationMs), color = Color.White, fontSize = 12.sp, fontFamily = FontFamily.Monospace)
                                  }

                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      OutlinedButton(
                                          onClick = onPrevious,
                                          shape = RoundedCornerShape(12.dp)
                                      ) {
                                          Icon(Icons.Default.SkipPrevious, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("Prev (A–Z)", color = Color.White, fontSize = 12.sp)
                                      }
                                      Button(
                                          onClick = onNextAlphabetical,
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107), contentColor = Color(0xFF1A1200)),
                                          shape = RoundedCornerShape(12.dp)
                                      ) {
                                          Text("Next File (A–Z)", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Icon(Icons.Default.SkipNext, contentDescription = null, modifier = Modifier.size(18.dp))
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Beast Reaming APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beast-Reaming-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
