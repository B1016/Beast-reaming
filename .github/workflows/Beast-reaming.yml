          class BoundedStream(
              inner: InputStream,
              private var bytesRemaining: Long
          ) : FilterInputStream(inner) {
              override fun read(): Int {
                  if (bytesRemaining <= 0L) return -1
                  val result = super.read()
                  if (result != -1) bytesRemaining--
                  return result
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  if (bytesRemaining <= 0L) return -1
                  val maxToRead = minOf(length.toLong(), bytesRemaining).toInt()
                  val count = super.read(buffer, offset, maxToRead)
                  if (count > 0) bytesRemaining -= count.toLong()
                  return count
              }
          }

          class BeastHttpServer(
              private val resolver: ContentResolver,
              port: Int,
              private val catalogProvider: () -> List<BeastMediaItem>,
              private val folderNamesProvider: () -> List<TextVal>
          ) : NanoHTTPD(port) {

              override fun serve(session: IHTTPSession): Response {
                  val uriPath = session.uri ?: "/"
                  if (uriPath == "/api/ping") {
                      val pong = JSONObject().apply {
                          put("app", "BeastReaming")
                          put("hostName", Build.MODEL ?: "Android Beast Host")
                          put("fileCount", catalogProvider().size)
                      }
                      return newFixedLengthResponse(Response.Status.OK, "application/json", pong.toString()).apply {
                          addHeader("Access-Control-Allow-Origin", "*")
                      }
                  }
                  if (uriPath == "/api/catalog") {
                      val root = JSONObject()
                      root.put("app", "BeastReaming")
                      root.put("hostName", Build.MODEL ?: "Android Beast Host")
                      val foldersArr = JSONArray()
                      folderNamesProvider().forEach { foldersArr.put(it) }
                      root.put("folders", foldersArr)
                      val itemsArr = JSONArray()
                      catalogProvider().forEach { item ->
                          val obj = JSONObject()
                          obj.put("id", item.id)
                          obj.put("name", item.name)
                          obj.put("folderName", item.folderName)
                          obj.put("sizeBytes", item.sizeBytes)
                          obj.put("mimeType", item.mimeType)
                          obj.put("streamPath", item.streamPath)
                          itemsArr.put(obj)
                      }
                      root.put("items", itemsArr)
                      return newFixedLengthResponse(Response.Status.OK, "application/json", root.toString()).apply {
                          addHeader("Access-Control-Allow-Origin", "*")
                      }
                  }
                  if (uriPath.startsWith("/stream/")) {
                      val segments = uriPath.removePrefix("/stream/").split("/")
                      val itemId = segments.firstOrNull()?.toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "Media not found")
                      return serveMediaWithRange(session, media)
                  }
                  return serveWebPortal(session)
              }

              private fun serveMediaWithRange(session: IHTTPSession, media: BeastMediaItem): Response {
                  val totalLength = media.sizeBytes
                  val rangeHeader = session.headers["range"]
                  try {
                      if (rangeHeader != null && rangeHeader.startsWith("bytes=") && totalLength > 0L) {
                          val rangeValue = rangeHeader.removePrefix("bytes=").trim()
                          val parts = rangeValue.split("-")
                          val startByte = parts.getOrNull(0)?.toLongOrNull() ?: 0L
                          val endByte = parts.getOrNull(1)?.takeIf { it.isNotEmpty() }?.toLongOrNull()
                              ?: (totalLength - 1L)
                          val safeEnd = endByte.coerceAtMost(totalLength - 1L)
                          if (startByte in 0 until totalLength && startByte <= safeEnd) {
                              val contentLen = (safeEnd - startByte) + 1L
                              val rawStream = resolver.openInputStream(media.uri)
                                  ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Unable to open stream")
                              var skipped = 0L
                              while (skipped < startByte) {
                                  val step = rawStream.skip(startByte - skipped)
                                  if (step <= 0L) break
                                  skipped += step
                              }
                              val bounded = BoundedStream(rawStream, contentLen)
                              return newFixedLengthResponse(
                                  Response.Status.PARTIAL_CONTENT,
                                  media.mimeType,
                                  bounded,
                                  contentLen
                              ).apply {
                                  addHeader("Accept-Ranges", "bytes")
                                  addHeader("Content-Range", "bytes $startByte-$safeEnd/$totalLength")
                                  addHeader("Content-Length", contentLen.toString())
                                  addHeader("Access-Control-Allow-Origin", "*")
                              }
                          }
                      }
                      val stream = resolver.openInputStream(media.uri)
                          ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Stream error")
                      val resp = if (totalLength > 0L) {
                          newFixedLengthResponse(Response.Status.OK, media.mimeType, stream, totalLength)
                      } else {
                          newChunkedResponse(Response.Status.OK, media.mimeType, stream)
                      }
                      resp.addHeader("Accept-Ranges", "bytes")
                      resp.addHeader("Access-Control-Allow-Origin", "*")
                      return resp
                  } catch (e: Exception) {
                      return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Error: ${e.message}")
                  }
              }

              private fun serveWebPortal(session: IHTTPSession): Response {
                  val hostHeader = session.headers["host"] ?: "localhost:8080"
                  val items = catalogProvider()
