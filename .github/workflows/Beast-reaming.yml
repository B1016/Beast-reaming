          @Composable
          fun BeastReamingScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { context.getSharedPreferences("beast_reaming_prefs", Context.MODE_PRIVATE) }

              var savedUriStrings by remember {
                  val raw = prefs.getString("folder_uris", "") ?: ""
                  mutableStateOf(if (raw.isBlank()) emptyList() else raw.split("|").filter { it.isNotBlank() }.take(3))
              }

              var folderSlots by remember { mutableStateOf(emptyList<BeastFolderSlot>()) }
              var hostedItems by remember { mutableStateOf(emptyList<BeastMediaItem>()) }
              var isHostActive by remember { mutableStateOf(true) }
              var isReceiveEnabled by remember { mutableStateOf(true) }
              var activeTab by remember { mutableStateOf(0) } // 0 = Host & VLC Links, 1 = Receive Stream (Jellyfin LAN)

              var localIp by remember { mutableStateOf(resolveDeviceLanIp(context)) }
              val serverPort = 8080
              var selectedFolderFilter by remember { mutableStateOf("All") }
              var searchQuery by remember { mutableStateOf("") }

              // Receiver state
              var remoteHostIp by remember { mutableStateOf(prefs.getString("last_remote_ip", "") ?: "") }
              var remoteHostPort by remember { mutableStateOf(prefs.getString("last_remote_port", "8080") ?: "8080") }
              var connectedServerTitle by remember { mutableStateOf("") }
              var remoteFolders by remember { mutableStateOf(emptyList<TextVal>()) }
              var remoteSelectedFolder by remember { mutableStateOf("All") }
              var remoteCatalog by remember { mutableStateOf(emptyList<BeastRemoteItem>()) }
              var isConnectingRemote by remember { mutableStateOf(false) }
              var remoteStatusMsg by remember { mutableStateOf("Enter another Android host IP or tap Scan LAN") }

              // Active in-app video/audio stream player url
              var activeStreamUrl by remember { mutableStateOf("") }
              var activeStreamTitle by remember { mutableStateOf("") }

              fun saveFoldersAndRescan(updated: List<TextVal>) {
                  val capped = updated.distinct().take(3)
                  savedUriStrings = capped
                  prefs.edit().putString("folder_uris", capped.joinToString("|")).apply()
                  scope.launch(Dispatchers.IO) {
                      val scanRes = scanSelectedFolders(context, capped)
                      val slots = scanRes.slots
                      val media = scanRes.items
                      withContext(Dispatchers.Main) {
                          folderSlots = slots
                          hostedItems = media
                          localIp = resolveDeviceLanIp(context)
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  saveFoldersAndRescan(savedUriStrings)
              }

              DisposableEffect(isHostActive) {
                  var server: BeastHttpServer? = null
                  if (isHostActive) {
                      try {
                          server = BeastHttpServer(
                              resolver = context.contentResolver,
                              port = serverPort,
                              catalogProvider = { hostedItems },
                              folderNamesProvider = { folderSlots.map { it.displayName } }
                          )
                          server.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                          localIp = resolveDeviceLanIp(context)
                      } catch (_: Exception) {}
                  }
                  onDispose {
                      try { server?.stop() } catch (_: Exception) {}
                  }
              }

              val folderPicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocumentTree()
              ) { uri: Uri? ->
                  if (uri != null) {
                      if (savedUriStrings.size >= 3 && !savedUriStrings.contains(uri.toString())) {
                          Toast.makeText(context, "Maximum of 3 folders reached!", Toast.LENGTH_SHORT).show()
                      } else {
                          try {
                              context.contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {}
                          saveFoldersAndRescan(savedUriStrings + uri.toString())
                      }
                  }
              }

              fun connectToRemoteHost(ipInput: String, portInput: String) {
                  if (!isReceiveEnabled) {
                      Toast.makeText(context, "Turn ON 'Receive Stream' first", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val cleanIp = ipInput.trim().removePrefix("http://").removePrefix("https://").substringBefore(":")
                  val cleanPort = portInput.trim().ifEmpty { "8080" }
                  if (cleanIp.isEmpty()) {
                      Toast.makeText(context, "Enter the host Android IP address", Toast.LENGTH_SHORT).show()
                      return
                  }
                  isConnectingRemote = true
                  remoteStatusMsg = "Connecting to $cleanIp:$cleanPort..."
                  prefs.edit().putString("last_remote_ip", cleanIp).putString("last_remote_port", cleanPort).apply()
                  scope.launch(Dispatchers.IO) {
                      try {
                          val endpoint = URL("http://$cleanIp:$cleanPort/api/catalog")
                          val conn = (endpoint.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 4000
                              readTimeout = 5000
                              requestMethod = "GET"
                          }
                          val code = conn.responseCode
                          if (code == 200) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(body)
                              val hostTitle = json.optString("hostName", "Android Host ($cleanIp)")
                              val fArr = json.optJSONArray("folders") ?: JSONArray()
                              val parsedFolders = mutableListOf<TextVal>()
                              for (i in 0 until fArr.length()) {
                                  parsedFolders.add(fArr.getString(i))
                              }
                              val itemsArr = json.optJSONArray("items") ?: JSONArray()
                              val parsedItems = mutableListOf<BeastRemoteItem>()
                              for (i in 0 until itemsArr.length()) {
                                  val obj = itemsArr.getJSONObject(i)
                                  val streamPath = obj.optString("streamPath", "")
                                  parsedItems.add(
                                      BeastRemoteItem(
                                          id = obj.optInt("id", i + 1),
                                          name = obj.optString("name", "Video_${i + 1}"),
                                          folderName = obj.optString("folderName", "Shared"),
                                          sizeBytes = obj.optLong("sizeBytes", 0L),
                                          mimeType = obj.optString("mimeType", "video/mp4"),
                                          streamUrl = "http://$cleanIp:$cleanPort$streamPath"
                                      )
                                  )
                              }
                              withContext(Dispatchers.Main) {
                                  connectedServerTitle = "$hostTitle ($cleanIp:$cleanPort)"
                                  remoteFolders = parsedFolders
                                  remoteSelectedFolder = "All"
                                  remoteCatalog = parsedItems
                                  remoteStatusMsg = "Connected to $hostTitle • ${parsedItems.size} files ready"
                                  isConnectingRemote = false
                              }
                          } else {
                              withContext(Dispatchers.Main) {
                                  remoteStatusMsg = "Host responded with HTTP $code"
                                  isConnectingRemote = false
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              remoteStatusMsg = "Could not reach $cleanIp:$cleanPort (${e.localizedMessage ?: "Check LAN/Hotspot"})"
                              isConnectingRemote = false
                          }
                      }
                  }
              }

              fun autoDiscoverLanHost() {
                  if (!isReceiveEnabled) return
                  val myIp = resolveDeviceLanIp(context)
                  val prefix = myIp.substringBeforeLast(".", "")
                  if (prefix.isEmpty()) return
                  isConnectingRemote = true
                  remoteStatusMsg = "Scanning $prefix.1 - $prefix.254 for Beast Reaming hosts..."
                  scope.launch(Dispatchers.IO) {
                      var foundIp: String? = null
                      coroutineScope {
                          val jobs = (1..254).map { hostByte ->
                              async {
                                  val candidate = "$prefix.$hostByte"
                                  if (candidate != myIp) {
                                      try {
                                          Socket().use { sock ->
                                              sock.connect(InetSocketAddress(candidate, 8080), 220)
                                          }
                                          val url = URL("http://$candidate:8080/api/ping")
                                          val c = (url.openConnection() as HttpURLConnection).apply {
                                              connectTimeout = 400
                                              readTimeout = 400
                                          }
                                          if (c.responseCode == 200) {
                                              foundIp = candidate
                                          }
                                      } catch (_: Exception) {}
                                  }
                              }
                          }
                          jobs.awaitAll()
                      }
                      withContext(Dispatchers.Main) {
                          val hit = foundIp
                          if (hit != null) {
                              remoteHostIp = hit
                              remoteHostPort = "8080"
                              connectToRemoteHost(hit, "8080")
                          } else {
                              isConnectingRemote = false
                              remoteStatusMsg = "No other Beast Reaming host found on $prefix.x:8080. Enter IP manually."
                          }
                      }
                  }
              }

