                                          .clip(RoundedCornerShape(14.dp))
                                          .background(Color(0xFF1A1200).copy(alpha = 0.55f))
                                          .border(1.dp, Color(0xFFFFD54F).copy(alpha = 0.35f), RoundedCornerShape(14.dp))
                                          .padding(horizontal = 12.dp, vertical = 10.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text("Host IP for Other Devices / Browser:", color = Color(0xFFFFE082), fontSize = 11.sp)
                                          Text(serverRootUrl, color = Color.White, fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      }
                                      TextButton(onClick = { copyTextToClipboard(context, "Beast Host URL", serverRootUrl) }) {
                                          Icon(Icons.Default.ContentCopy, contentDescription = null, tint = Color(0xFFFFD54F), modifier = Modifier.size(16.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("Copy IP", color = Color(0xFFFFD54F), fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }

                          // Search & Folder Filter Bar
                          item {
                              LiquidGlassCard {
                                  OutlinedTextField(
                                      value = searchQuery,
                                      onValueChange = { searchQuery = it },
                                      placeholder = { Text("Search hosted videos & files...", color = Color.White.copy(alpha = 0.5f)) },
                                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = Color(0xFFFFD54F)) },
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth(),
                                      shape = RoundedCornerShape(16.dp)
                                  )
                                  if (folderSlots.isNotEmpty()) {
                                      Spacer(modifier = Modifier.height(10.dp))
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .horizontalScroll(rememberScrollState()),
                                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          val filterOptions = listOf("All") + folderSlots.map { it.displayName }
                                          filterOptions.forEach { folderTab ->
                                              FilterChip(
                                                  selected = selectedFolderFilter == folderTab,
                                                  onClick = { selectedFolderFilter = folderTab },
                                                  label = { Text(folderTab) }
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          val visibleHosted = hostedItems.filter { item ->
                              (selectedFolderFilter == "All" || item.folderName == selectedFolderFilter) &&
                                  (searchQuery.isBlank() || item.name.contains(searchQuery, ignoreCase = true))
                          }

                          items(visibleHosted, key = { it.id }) { media ->
                              val directVlcUrl = "http://$localIp:$serverPort${media.streamPath}"
                              LiquidGlassCard {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                          Box(
                                              modifier = Modifier
                                                  .size(42.dp)
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .background(goldenGradient),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Icon(
                                                  imageVector = if (media.mimeType.startsWith("video")) Icons.Default.PlayCircleFilled else Icons.Default.InsertDriveFile,
                                                  contentDescription = null,
                                                  tint = Color(0xFF1A1200)
                                              )
                                          }
                                          Spacer(modifier = Modifier.width(12.dp))
                                          Column {
                                              Text(media.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 15.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                              Text("${media.folderName} • ${formatByteSize(media.sizeBytes)} • ${media.mimeType}", color = Color.White.copy(alpha = 0.68f), fontSize = 12.sp)
                                          }
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(10.dp))

                                  // Direct Copyable VLC Link Box
                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(Color.Black.copy(alpha = 0.42f))
                                          .padding(horizontal = 10.dp, vertical = 8.dp)
                                  ) {
                                      Text(
                                          text = directVlcUrl,
                                          color = Color(0xFFFFE082),
                                          fontFamily = FontFamily.Monospace,
                                          fontSize = 11.sp,
                                          maxLines = 2,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }

                                  Spacer(modifier = Modifier.height(10.dp))

                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      Button(
                                          onClick = { copyTextToClipboard(context, "VLC Stream URL", directVlcUrl) },
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107), contentColor = Color(0xFF1A1200)),
                                          shape = RoundedCornerShape(12.dp),
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                                          Spacer(modifier = Modifier.width(6.dp))
                                          Text("Copy VLC Link", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      }
                                      OutlinedButton(
                                          onClick = {
                                              activeStreamTitle = media.name
                                              activeStreamUrl = directVlcUrl
                                          },
                                          shape = RoundedCornerShape(12.dp),
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Icon(Icons.Default.PlayArrow, contentDescription = null, tint = Color(0xFFFFD54F), modifier = Modifier.size(18.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("Play Here", color = Color.White, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      } else {
                          // TAB 1: RECEIVE STREAM FROM ANOTHER ANDROID DEVICE (JELLYFIN-STYLE PEER CLIENT)
                          item {
                              LiquidGlassCard(accentBorder = true) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(
                                              text = "Connect to Another Beast Host",
                                              color = Color(0xFFFFE082),
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 16.sp
                                          )
                                          Text(
                                              text = if (isReceiveEnabled) "Log in with the IP shown on your hosting Android device" else "Receiver is turned OFF. Toggle 'Receive Stream' ON above to connect.",
                                              color = Color.White.copy(alpha = 0.72f),
                                              fontSize = 12.sp
                                          )
                                      }
                                  }

                                  AnimatedVisibility(visible = isReceiveEnabled) {
                                      Column(modifier = Modifier.fillMaxWidth().padding(top = 12.dp)) {
                                          Row(
                                              modifier = Modifier.fillMaxWidth(),
                                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                                          ) {
                                              OutlinedTextField(
                                                  value = remoteHostIp,
                                                  onValueChange = { remoteHostIp = it },
                                                  label = { Text("Host Android IP") },
                                                  placeholder = { Text("192.168.43.1") },
                                                  singleLine = true,
                                                  modifier = Modifier.weight(0.68f),
                                                  shape = RoundedCornerShape(14.dp)
                                              )
                                              OutlinedTextField(
                                                  value = remoteHostPort,
                                                  onValueChange = { remoteHostPort = it },
                                                  label = { Text("Port") },
                                                  singleLine = true,
                                                  modifier = Modifier.weight(0.32f),
                                                  shape = RoundedCornerShape(14.dp)
                                              )
                                          }

                                          Spacer(modifier = Modifier.height(10.dp))

                                          Row(
                                              modifier = Modifier.fillMaxWidth(),
                                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                                          ) {
                                              Button(
                                                  onClick = { connectToRemoteHost(remoteHostIp, remoteHostPort) },
                                                  enabled = !isConnectingRemote,
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107), contentColor = Color(0xFF1A1200)),
                                                  shape = RoundedCornerShape(14.dp),
                                                  modifier = Modifier.weight(1f)
                                              ) {
                                                  Icon(Icons.Default.Login, contentDescription = null, modifier = Modifier.size(18.dp))
                                                  Spacer(modifier = Modifier.width(6.dp))
                                                  Text(if (isConnectingRemote) "Connecting..." else "Log In to Host", fontWeight = FontWeight.Bold)
                                              }
                                              OutlinedButton(
                                                  onClick = { autoDiscoverLanHost() },
                                                  enabled = !isConnectingRemote,
                                                  shape = RoundedCornerShape(14.dp),
                                                  modifier = Modifier.weight(1f)
                                              ) {
                                                  Icon(Icons.Default.WifiFind, contentDescription = null, tint = Color(0xFF80D8FF), modifier = Modifier.size(18.dp))
                                                  Spacer(modifier = Modifier.width(6.dp))
                                                  Text("Scan LAN", color = Color.White)
                                              }
                                          }

                                          Spacer(modifier = Modifier.height(10.dp))

                                          Text(
                                              text = remoteStatusMsg,
                                              color = Color(0xFFFFE082),
                                              fontSize = 12.sp
                                          )

                                          if (remoteFolders.isNotEmpty()) {
                                              Spacer(modifier = Modifier.height(8.dp))
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .horizontalScroll(rememberScrollState()),
                                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                                              ) {
                                                  (listOf("All") + remoteFolders).forEach { rFolder ->
                                                      FilterChip(
                                                          selected = remoteSelectedFolder == rFolder,
                                                          onClick = { remoteSelectedFolder = rFolder },
                                                          label = { Text(rFolder) }
                                                      )
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          if (isReceiveEnabled) {
                              val visibleRemote = remoteCatalog.filter {
                                  remoteSelectedFolder == "All" || it.folderName == remoteSelectedFolder
                              }
                              items(visibleRemote, key = { it.id }) { rItem ->
                                  LiquidGlassCard {
                                      Text(
                                          text = rItem.name,
                                          color = Color.White,
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 15.sp
                                      )
                                      Text(
                                          text = "${rItem.folderName} • ${formatByteSize(rItem.sizeBytes)} • ${rItem.mimeType}",
                                          color = Color.White.copy(alpha = 0.7f),
                                          fontSize = 12.sp
                                      )
                                      Spacer(modifier = Modifier.height(8.dp))
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(10.dp))
                                              .background(Color.Black.copy(alpha = 0.4f))
                                              .padding(8.dp)
                                      ) {
                                          Text(
                                              text = rItem.streamUrl,
                                              color = Color(0xFF80D8FF),
                                              fontFamily = FontFamily.Monospace,
                                              fontSize = 11.sp
                                          )
                                      }
                                      Spacer(modifier = Modifier.height(10.dp))
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          Button(
                                              onClick = {
                                                  activeStreamTitle = rItem.name
                                                  activeStreamUrl = rItem.streamUrl
                                              },
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107), contentColor = Color(0xFF1A1200)),
                                              shape = RoundedCornerShape(12.dp),
                                              modifier = Modifier.weight(1f)
                                          ) {
                                              Icon(Icons.Default.PlayArrow, contentDescription = null, modifier = Modifier.size(18.dp))
                                              Spacer(modifier = Modifier.width(4.dp))
                                              Text("Stream Here", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                          }
                                          OutlinedButton(
                                              onClick = { copyTextToClipboard(context, "Remote VLC URL", rItem.streamUrl) },
                                              shape = RoundedCornerShape(12.dp),
                                              modifier = Modifier.weight(1f)
                                          ) {
                                              Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                                              Spacer(modifier = Modifier.width(4.dp))
                                              Text("Copy VLC Link", fontSize = 12.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Beast Reaming APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beast-Reaming-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
