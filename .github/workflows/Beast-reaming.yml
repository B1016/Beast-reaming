          fun resolveDeviceLanIp(context: Context): String {
              try {
                  val interfaces = NetworkInterface.getNetworkInterfaces()
                  while (interfaces.hasMoreElements()) {
                      val intf = interfaces.nextElement()
                      if (!intf.isUp || intf.isLoopback) continue
                      val addrs = intf.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val addr = addrs.nextElement()
                          if (addr is Inet4Address && !addr.isLoopbackAddress) {
                              val ip = addr.hostAddress ?: continue
                              if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                  return ip
                              }
                          }
                      }
                  }
                  val wifiMgr = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                  val ipInt = wifiMgr?.connectionInfo?.ipAddress ?: 0
                  if (ipInt != 0) {
                      return String.format(
                          "%d.%d.%d.%d",
                          ipInt and 0xff,
                          ipInt shr 8 and 0xff,
                          ipInt shr 16 and 0xff,
                          ipInt shr 24 and 0xff
                      )
                  }
              } catch (_: Exception) {}
              return "192.168.43.1"
          }

          fun scanSelectedFolders(context: Context, uriStrings: List<TextVal>): BeastScanResult {
              val slots = mutableListOf<BeastFolderSlot>()
              val items = mutableListOf<BeastMediaItem>()
              var nextId = 1

              fun walkDocumentNode(node: DocumentFile, folderLabel: String, depth: Int) {
                  if (depth > 4) return
                  val children = try { node.listFiles() } catch (_: Exception) { emptyArray() }
                  for (child in children) {
                      if (child.isDirectory) {
                          walkDocumentNode(child, folderLabel, depth + 1)
                      } else if (child.isFile) {
                          val fileName = child.name ?: "stream_$nextId"
                          val mime = child.type ?: guessMimeFromName(fileName)
                          val safeUrlName = URLEncoder.encode(fileName, "UTF-8").replace("+", "%20")
                          items.add(
                              BeastMediaItem(
                                  id = nextId,
                                  name = fileName,
                                  folderName = folderLabel,
                                  sizeBytes = child.length(),
                                  mimeType = mime,
                                  uri = child.uri,
                                  streamPath = "/stream/$nextId/$safeUrlName"
                              )
                          )
                          nextId++
                      }
                  }
              }

              for ((idx, rawUri) in uriStrings.take(3).withIndex()) {
                  val parsed = Uri.parse(rawUri)
                  val rootDoc = DocumentFile.fromTreeUri(context, parsed)
                  if (rootDoc != null && rootDoc.exists()) {
                      val label = rootDoc.name ?: "Folder ${idx + 1}"
                      val beforeCount = items.size
                      walkDocumentNode(rootDoc, label, 0)
                      val addedCount = items.size - beforeCount
                      slots.add(BeastFolderSlot(rawUri, label, addedCount))
                  }
              }
              return BeastScanResult(slots, items)
          }

          fun guessMimeFromName(name: String): String {
              val lower = name.lowercase()
              return when {
                  lower.endsWith(".mp4") || lower.endsWith(".m4v") -> "video/mp4"
                  lower.endsWith(".mkv") -> "video/x-matroska"
                  lower.endsWith(".webm") -> "video/webm"
                  lower.endsWith(".avi") -> "video/x-msvideo"
                  lower.endsWith(".mov") -> "video/quicktime"
                  lower.endsWith(".mp3") -> "audio/mpeg"
                  lower.endsWith(".flac") -> "audio/flac"
                  lower.endsWith(".wav") -> "audio/wav"
                  else -> "application/octet-stream"
              }
          }

          fun formatByteSize(bytes: Long): String {
              val mb = bytes.toDouble() / (1024.0 * 1024.0)
              return if (mb >= 1024.0) {
                  String.format("%.2f GB", mb / 1024.0)
              } else if (mb >= 1.0) {
                  String.format("%.1f MB", mb)
              } else {
                  String.format("%d KB", (bytes / 1024L).coerceAtLeast(1L))
              }
          }

          fun copyTextToClipboard(context: Context, label: String, value: String) {
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText(label, value))
              Toast.makeText(context, "Copied link: $value", Toast.LENGTH_SHORT).show()
          }

          @Composable
          fun HollowLionEmblem(modifier: Modifier = Modifier) {
              val goldenBrush = Brush.linearGradient(
                  colors = listOf(Color(0xFFFFF59D), Color(0xFFFFCA28), Color(0xFFFF8F00))
              )
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(16.dp))
                      .background(goldenBrush)
                      .border(1.2.dp, Color.White.copy(alpha = 0.55f), RoundedCornerShape(16.dp)),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize().padding(7.dp)) {
                      val w = size.width
                      val h = size.height
                      val strokeStyle = Stroke(width = w * 0.068f, cap = StrokeCap.Round, join = StrokeJoin.Round)
                      val lionPath = Path().apply {
                          // Outer geometric mane
                          moveTo(w * 0.50f, h * 0.08f)
                          lineTo(w * 0.78f, h * 0.18f)
                          lineTo(w * 0.92f, h * 0.42f)
                          lineTo(w * 0.85f, h * 0.70f)
                          lineTo(w * 0.68f, h * 0.88f)
                          lineTo(w * 0.50f, h * 0.95f)
                          lineTo(w * 0.32f, h * 0.88f)
                          lineTo(w * 0.15f, h * 0.70f)
                          lineTo(w * 0.08f, h * 0.42f)
                          lineTo(w * 0.22f, h * 0.18f)
                          close()
                          // Inner angular brow and nose bridge
                          moveTo(w * 0.26f, h * 0.38f)
                          lineTo(w * 0.42f, h * 0.44f)
                          lineTo(w * 0.50f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.44f)
                          lineTo(w * 0.74f, h * 0.38f)
                          // Muzzle & jaw structure
                          moveTo(w * 0.42f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.62f)
                          lineTo(w * 0.50f, h * 0.72f)
                          close()
                          moveTo(w * 0.50f, h * 0.72f)
                          lineTo(w * 0.38f, h * 0.80f)
                          lineTo(w * 0.50f, h * 0.88f)
                          lineTo(w * 0.62f, h * 0.80f)
                          lineTo(w * 0.50f, h * 0.72f)
                      }
                      drawPath(path = lionPath, color = Color(0xFF1A1200), style = strokeStyle)
                  }
              }
          }

