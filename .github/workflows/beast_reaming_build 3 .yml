          typealias TextVal = String

          data class BeastFolderSlot(
              val uriString: TextVal,
              val displayName: TextVal,
              val itemCount: Int
          )

          data class BeastMediaItem(
              val id: Int,
              val name: TextVal,
              val folderName: TextVal,
              val sizeBytes: Long,
              val mimeType: TextVal,
              val uri: Uri,
              val srtUri: Uri?,
              val vlcPath: TextVal,
              val webStreamPath: TextVal,
              val srtPath: TextVal
          )

          data class BeastWatchRecord(
              val mediaName: TextVal,
              val folderName: TextVal,
              val positionSec: Int,
              val durationSec: Int,
              val updatedAt: TextVal,
              val completed: Boolean
          )

          data class BeastUserAccount(
              val username: TextVal,
              val password: TextVal,
              val token: TextVal,
              val isBlocked: Boolean,
              val createdAt: TextVal,
              val lastActive: TextVal,
              val currentActivity: TextVal,
              val watchHistory: List<BeastWatchRecord>
          )

          data class BeastLogEntry(
              val id: Long,
