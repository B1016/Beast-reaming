          @Composable
          fun BeastReamingHostApp() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { context.getSharedPreferences("beast_reaming_v3_prefs", Context.MODE_PRIVATE) }
              val db = remember { BeastRuntimeBridge.ensureDb(context.applicationContext) }

              // Dock Tab: 0 = Home, 1 = Users (Admin & Watch History), 2 = Files (A-Z), 3 = Logs
              var selectedDockTab by remember { mutableStateOf(0) }

              var savedUriStrings by remember {
                  val raw = prefs.getString("folder_uris", "") ?: ""
                  mutableStateOf(if (raw.isBlank()) emptyList() else raw.split("|").filter { it.isNotBlank() }.take(3))
              }

              var localIp by remember { mutableStateOf(resolveDeviceLanIp(context)) }
              val serverPort = 8080
              val websiteUrl = "http://$localIp:$serverPort"

              // Files Filter & Search
              var selectedFolderFilter by remember { mutableStateOf("All") }
              var searchQuery by remember { mutableStateOf("") }

              // Admin New/Reset User Inputs
              var adminNewUser by remember { mutableStateOf("") }
              var adminNewPass by remember { mutableStateOf("") }
              var expandedHistoryUser by remember { mutableStateOf("") }

              // Logs Filter
              var logFilterErrorsOnly by remember { mutableStateOf(false) }

              // Fullscreen Netflix-Style Alphabetical Player State
              var isFullscreenPlayerOpen by remember { mutableStateOf(false) }
              var playerQueueTitles by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerQueueUrls by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerQueueSrtUrls by remember { mutableStateOf(emptyList<TextVal>()) }
              var playerCurrentIndex by remember { mutableStateOf(0) }

              fun saveFoldersAndRescan(updated: List<TextVal>) {
                  val capped = updated.distinct().take(3)
                  savedUriStrings = capped
                  prefs.edit().putString("folder_uris", capped.joinToString("|")).apply()
                  scope.launch(Dispatchers.IO) {
                      val scanRes = scanSelectedFoldersAlphabetical(context, capped)
                      withContext(Dispatchers.Main) {
                          BeastRuntimeBridge.folderSlots = scanRes.slots
                          BeastRuntimeBridge.hostedItems = scanRes.items
                          localIp = resolveDeviceLanIp(context)
                          BeastRuntimeBridge.addLog("SYSTEM", "Indexed ${scanRes.items.size} files (A–Z) in ${scanRes.slots.size}/3 folders", false)
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  BeastRuntimeBridge.hostOnWeb = prefs.getBoolean("host_web", true)
                  BeastRuntimeBridge.hostOnVlc = prefs.getBoolean("host_vlc", true)
                  BeastRuntimeBridge.syncAccountsState()
                  saveFoldersAndRescan(savedUriStrings)
              }

              val folderPicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocumentTree()
              ) { uri: Uri? ->
                  if (uri != null) {
                      if (savedUriStrings.size >= 3 && !savedUriStrings.contains(uri.toString())) {
                          Toast.makeText(context, "Maximum of 3 folders reached!", Toast.LENGTH_SHORT).show()
                      } else {
                          try {
                              context.contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {}
                          saveFoldersAndRescan(savedUriStrings + uri.toString())
                      }
                  }
              }

