              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn-gold" style="width:auto;padding:8px 14px;" onclick="playNextAz()">Next File (A–Z) &rsaquo;</button>
                <button class="vlc-btn" style="padding:8px 14px;border-radius:10px;cursor:pointer;" onclick="closePlayer()">Close</button>
              </div>
            </div>
            <video id="webVideo" controls autoplay></video>
          </div>

          <script>
          let authMode = 'signin';
          let sessionToken = localStorage.getItem('beast_token') || '';
          let currentUser = localStorage.getItem('beast_user') || '';
          let catalog = [];
          let watchHistory = [];
          let currentIdx = -1;
          let syncTimer = null;

          function fmtTime(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' + r : r);
          }

          function switchAuthMode(mode) {
            authMode = mode;
            document.getElementById('tabSignIn').className = 'tab' + (mode === 'signin' ? ' active' : '');
            document.getElementById('tabSignUp').className = 'tab' + (mode === 'signup' ? ' active' : '');
            document.getElementById('authSubmitBtn').innerText = mode === 'signin' ? 'Sign In to Account' : 'Create Account & Start Watching';
            document.getElementById('errMsg').innerText = '';
          }

          async function submitAuth() {
            const u = document.getElementById('userIn').value.trim();
            const p = document.getElementById('passIn').value.trim();
            if (!u || !p) {
              document.getElementById('errMsg').innerText = 'Enter both username and password';
              return;
            }
            const ep = authMode === 'signup' ? '/api/signup' : '/api/signin';
            const res = await fetch(ep + '?u=' + encodeURIComponent(u) + '&p=' + encodeURIComponent(p));
            const data = await res.json();
            if (!res.ok || !data.ok) {
              document.getElementById('errMsg').innerText = data.error || 'Authentication failed';
              return;
            }
            // Automatically count Sign-Up or Sign-In as an active persistent login!
            sessionToken = data.token;
            currentUser = data.username;
            localStorage.setItem('beast_token', sessionToken);
            localStorage.setItem('beast_user', currentUser);
            applyCatalogPayload(data);
          }

          async function restoreSessionOnLoad() {
            if (!sessionToken) return;
            try {
              const res = await fetch('/api/session?token=' + encodeURIComponent(sessionToken));
              if (res.ok) {
                const data = await res.json();
                if (data.ok) {
                  currentUser = data.username;
                  applyCatalogPayload(data);
                  return;
                }
              }
            } catch (e) {}
            localStorage.removeItem('beast_token');
            sessionToken = '';
          }

          function applyCatalogPayload(data) {
            catalog = data.items || [];
            watchHistory = data.watchHistory || [];
            document.getElementById('authView').style.display = 'none';
            document.getElementById('libraryView').style.display = 'block';
            document.getElementById('userGreeting').innerText = 'Account: ' + currentUser + ' • ' + catalog.length + ' Files (A–Z)';
            renderLibrary();
          }

          async function doLogout() {
            if (sessionToken) {
              try { await fetch('/api/logout?token=' + encodeURIComponent(sessionToken)); } catch (e) {}
            }
            localStorage.removeItem('beast_token');
            localStorage.removeItem('beast_user');
            sessionToken = '';
            currentUser = '';
            closePlayer();
            document.getElementById('libraryView').style.display = 'none';
            document.getElementById('authView').style.display = 'flex';
          }

          function copyVlcUrl(idx, btn) {
            const item = catalog[idx];
            if (!item) return;
            navigator.clipboard.writeText(location.origin + item.vlcPath);
            btn.innerText = 'Copied!';
          }

          function renderLibrary() {
            // 1. Render Personal Watch History & Continue Watching shelf
            const hSec = document.getElementById('historySection');
            const hGrid = document.getElementById('historyGrid');
            hGrid.innerHTML = '';
            if (watchHistory.length > 0) {
              hSec.style.display = 'block';
              watchHistory.forEach(h => {
                const idx = catalog.findIndex(c => c.name === h.mediaName);
                if (idx === -1) return;
                const pct = h.completed ? 100 : Math.min(99, Math.round((h.positionSec / Math.max(1, h.durationSec)) * 100));
                const statusLabel = h.completed ? 'Watched • Watch Again' : ('Resume at ' + fmtTime(h.positionSec) + ' / ' + fmtTime(h.durationSec));
                const resumeSec = h.completed ? 0 : h.positionSec;
                const card = document.createElement('div');
                card.className = 'mcard';
                card.innerHTML = '<div><span class="badge">' + h.folderName + '</span> <span class="badge">' + h.updatedAt + '</span>' +
                  '<div class="mtitle">' + h.mediaName + '</div>' +
                  '<div class="mmeta">' + statusLabel + '</div>' +
                  '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%;"></div></div></div>' +
                  '<div class="actions"><button class="play-btn" onclick="openPlayer(' + idx + ',' + resumeSec + ')">&#9654; ' + (h.completed ? 'Watch Again' : 'Resume Stream') + '</button></div>';
                hGrid.appendChild(card);
              });
            } else {
              hSec.style.display = 'none';
            }

            // 2. Render A-Z All Files Grid
            const q = (document.getElementById('searchBox').value || '').toLowerCase();
            const box = document.getElementById('mediaGrid');
            box.innerHTML = '';
            catalog.forEach((item, idx) => {
              if (q && !item.name.toLowerCase().includes(q)) return;
              const hMatch = watchHistory.find(h => h.mediaName === item.name);
              const resumePos = (hMatch && !hMatch.completed) ? hMatch.positionSec : 0;
              const mb = (item.sizeBytes / (1024*1024)).toFixed(1) + ' MB';
              const card = document.createElement('div');
              card.className = 'mcard';
              card.innerHTML = '<div><span class="badge">' + item.folderName + '</span>' +
                (item.srtPath ? ' <span class="badge">SRT</span>' : '') +
                (hMatch ? ' <span class="badge">' + (hMatch.completed ? 'Watched' : 'In Progress') + '</span>' : '') +
                '<div class="mtitle">' + item.name + '</div>' +
                '<div class="mmeta">' + mb + ' • ' + item.mimeType + '</div></div>' +
                '<div class="actions"><button class="play-btn" onclick="openPlayer(' + idx + ',' + resumePos + ')">&#9654; ' + (resumePos > 0 ? 'Resume (' + fmtTime(resumePos) + ')' : 'Play Fullscreen') + '</button>' +
                '<button class="vlc-btn" onclick="copyVlcUrl(' + idx + ', this)">Copy VLC Link</button></div>';
              box.appendChild(card);
            });
          }

          async function sendProgress(endedFlag) {
            const item = catalog[currentIdx];
            const vid = document.getElementById('webVideo');
            if (!item || !vid || !sessionToken) return;
            const pos = Math.floor(vid.currentTime || 0);
            const dur = Math.floor(vid.duration || 0);
            if (dur <= 0) return;
            try {
              const res = await fetch('/api/progress?token=' + encodeURIComponent(sessionToken) + '&id=' + item.id + '&pos=' + pos + '&dur=' + dur + '&ended=' + (endedFlag ? '1' : '0'));
              if (res.ok) {
                const data = await res.json();
                if (data.ok) {
                  watchHistory = data.watchHistory || watchHistory;
                  renderLibrary();
                }
              }
            } catch (e) {}
          }

          function openPlayer(idx, startSec) {
            currentIdx = idx;
            const item = catalog[idx];
            if (!item) return;
            const modal = document.getElementById('playerModal');
            const vid = document.getElementById('webVideo');
            modal.style.display = 'flex';
            document.getElementById('nowTitle').innerText = item.name;
            document.getElementById('queueInfo').innerText = 'PLAYING A–Z (' + (idx + 1) + ' OF ' + catalog.length + ')';
            vid.innerHTML = '';
            vid.src = item.webStreamPath + '?token=' + encodeURIComponent(sessionToken);
            if (item.srtPath) {
              const tr = document.createElement('track');
              tr.kind = 'subtitles'; tr.label = 'Subtitles'; tr.srclang = 'en'; tr.default = true;
              tr.src = item.srtPath + '?token=' + encodeURIComponent(sessionToken);
              vid.appendChild(tr);
            }
            vid.onloadedmetadata = () => {
              if (startSec && startSec > 0 && startSec < vid.duration - 4) {
                vid.currentTime = startSec;
              }
              sendProgress(false);
            };
            vid.onpause = () => sendProgress(false);
            vid.onended = () => {
              sendProgress(true);
              playNextAz();
            };
            if (syncTimer) clearInterval(syncTimer);
            syncTimer = setInterval(() => {
              if (!vid.paused && !vid.ended) sendProgress(false);
            }, 5000);
            vid.play();
          }

          function playNextAz() {
            if (catalog.length === 0) return;
            openPlayer((currentIdx + 1) % catalog.length, 0);
          }

          function closePlayer() {
            sendProgress(false);
            if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
            const vid = document.getElementById('webVideo');
            vid.pause(); vid.src = '';
            document.getElementById('playerModal').style.display = 'none';
          }

          window.addEventListener('DOMContentLoaded', restoreSessionOnLoad);
          </script>
          </body>
          </html>
                  """.trimIndent()
                  return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html)
              }
          }

