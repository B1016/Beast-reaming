          )

          fun nowTimeStamp(): TextVal {
              return SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
          }

          fun formatSecShort(sec: Int): TextVal {
              val s = sec.coerceAtLeast(0)
              return String.format(Locale.US, "%02d:%02d", s / 60, s % 60)
          }

          class BeastAccountDatabase(private val dbFile: File) {
              private val accounts = mutableListOf<BeastUserAccount>()

              init {
                  loadFromDisk()
              }

              @Synchronized
              fun loadFromDisk() {
                  accounts.clear()
                  if (!dbFile.exists()) return
                  try {
                      val raw = dbFile.readText()
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          val histArr = obj.optJSONArray("watchHistory") ?: JSONArray()
                          val histList = mutableListOf<BeastWatchRecord>()
                          for (j in 0 until histArr.length()) {
                              val h = histArr.getJSONObject(j)
                              histList.add(
                                  BeastWatchRecord(
                                      mediaName = h.optString("mediaName", ""),
                                      folderName = h.optString("folderName", ""),
                                      positionSec = h.optInt("positionSec", 0),
                                      durationSec = h.optInt("durationSec", 0),
                                      updatedAt = h.optString("updatedAt", ""),
                                      completed = h.optBoolean("completed", false)
                                  )
                              )
                          }
                          accounts.add(
                              BeastUserAccount(
                                  username = obj.optString("username", ""),
                                  password = obj.optString("password", ""),
                                  token = obj.optString("token", ""),
                                  isBlocked = obj.optBoolean("isBlocked", false),
                                  createdAt = obj.optString("createdAt", ""),
                                  lastActive = obj.optString("lastActive", ""),
                                  currentActivity = obj.optString("currentActivity", "Idle"),
                                  watchHistory = histList
                              )
                          )
                      }
                  } catch (_: Exception) {}
              }

              @Synchronized
              private fun saveToDisk() {
                  try {
                      val arr = JSONArray()
                      for (acc in accounts) {
                          val obj = JSONObject()
                          obj.put("username", acc.username)
                          obj.put("password", acc.password)
                          obj.put("token", acc.token)
                          obj.put("isBlocked", acc.isBlocked)
                          obj.put("createdAt", acc.createdAt)
                          obj.put("lastActive", acc.lastActive)
                          obj.put("currentActivity", acc.currentActivity)
                          val hArr = JSONArray()
                          for (h in acc.watchHistory) {
                              val hObj = JSONObject()
                              hObj.put("mediaName", h.mediaName)
                              hObj.put("folderName", h.folderName)
                              hObj.put("positionSec", h.positionSec)
                              hObj.put("durationSec", h.durationSec)
                              hObj.put("updatedAt", h.updatedAt)
                              hObj.put("completed", h.completed)
                              hArr.put(hObj)
                          }
                          obj.put("watchHistory", hArr)
                          arr.put(obj)
                      }
                      dbFile.writeText(arr.toString())
                  } catch (_: Exception) {}
              }

              @Synchronized
              fun snapshotAccounts(): List<BeastUserAccount> {
                  return accounts.toList()
              }

              @Synchronized
              fun signUpAndAutoLogin(rawUser: TextVal, rawPass: TextVal): BeastUserAccount? {
                  val u = rawUser.trim()
                  val p = rawPass.trim()
                  if (u.length < 2 || p.isEmpty()) return null
                  if (accounts.any { it.username.equals(u, ignoreCase = true) }) return null
                  val stamp = nowTimeStamp()
                  val newAcc = BeastUserAccount(
                      username = u,
                      password = p,
                      token = UUID.randomUUID().toString().replace("-", ""),
                      isBlocked = false,
                      createdAt = stamp,
                      lastActive = stamp,
                      currentActivity = "Signed up & browsing library",
                      watchHistory = emptyList()
                  )
                  accounts.add(newAcc)
                  saveToDisk()
                  return newAcc
              }

              @Synchronized
              fun signIn(rawUser: TextVal, rawPass: TextVal): BeastUserAccount? {
                  val u = rawUser.trim()
                  val p = rawPass.trim()
                  val idx = accounts.indexOfFirst { it.username.equals(u, ignoreCase = true) && it.password == p }
                  if (idx == -1) return null
                  val existing = accounts[idx]
                  if (existing.isBlocked) return null
                  val activeToken = if (existing.token.isNotEmpty()) existing.token else UUID.randomUUID().toString().replace("-", "")
                  val updated = existing.copy(
                      token = activeToken,
                      lastActive = nowTimeStamp(),
                      currentActivity = "Signed in & browsing library"
                  )
                  accounts[idx] = updated
                  saveToDisk()
                  return updated
              }

              @Synchronized
              fun findByToken(token: TextVal): BeastUserAccount? {
                  if (token.isBlank()) return null
                  val acc = accounts.find { it.token == token } ?: return null
                  if (acc.isBlocked) return null
                  return acc
              }

              @Synchronized
              fun logoutByToken(token: TextVal): Boolean {
                  if (token.isBlank()) return false
                  val idx = accounts.indexOfFirst { it.token == token }
                  if (idx == -1) return false
                  val existing = accounts[idx]
                  accounts[idx] = existing.copy(
                      token = "",
                      lastActive = nowTimeStamp(),
                      currentActivity = "Logged out"
                  )
                  saveToDisk()
                  return true
              }

              @Synchronized
              fun recordWatchProgress(
                  token: TextVal,
                  mediaName: TextVal,
                  folderName: TextVal,
                  positionSec: Int,
                  durationSec: Int,
                  ended: Boolean
              ): BeastUserAccount? {
                  val idx = accounts.indexOfFirst { it.token == token && !it.isBlocked }
                  if (idx == -1) return null
                  val acc = accounts[idx]
                  val stamp = nowTimeStamp()
                  val safeDur = durationSec.coerceAtLeast(1)
                  val safePos = positionSec.coerceIn(0, safeDur)
                  val isDone = ended || (safeDur > 10 && safePos >= safeDur - 5)

                  val mutableHist = acc.watchHistory.toMutableList()
                  val existingIdx = mutableHist.indexOfFirst { it.mediaName == mediaName }
                  val newRecord = BeastWatchRecord(
                      mediaName = mediaName,
                      folderName = folderName,
                      positionSec = if (isDone) 0 else safePos,
                      durationSec = safeDur,
                      updatedAt = stamp,
                      completed = isDone
                  )
                  if (existingIdx != -1) {
                      mutableHist.removeAt(existingIdx)
                  }
                  mutableHist.add(0, newRecord)

                  val statusText = if (isDone) {
                      "Finished watching $mediaName"
                  } else {
                      "Watching $mediaName (${formatSecShort(safePos)} / ${formatSecShort(safeDur)})"
                  }
                  val updated = acc.copy(
                      lastActive = stamp,
                      currentActivity = statusText,
                      watchHistory = mutableHist.take(50)
                  )
                  accounts[idx] = updated
                  saveToDisk()
                  return updated
              }

              @Synchronized
              fun adminCreateOrResetUser(rawUser: TextVal, rawPass: TextVal) {
                  val u = rawUser.trim()
                  val p = rawPass.trim()
                  if (u.isEmpty() || p.isEmpty()) return
                  val stamp = nowTimeStamp()
                  val idx = accounts.indexOfFirst { it.username.equals(u, ignoreCase = true) }
                  if (idx != -1) {
                      val old = accounts[idx]
                      accounts[idx] = old.copy(
                          password = p,
                          isBlocked = false,
                          lastActive = stamp,
                          currentActivity = "Password updated by Admin"
                      )
                  } else {
                      accounts.add(
                          BeastUserAccount(
                              username = u,
                              password = p,
                              token = UUID.randomUUID().toString().replace("-", ""),
                              isBlocked = false,
                              createdAt = stamp,
                              lastActive = stamp,
                              currentActivity = "Created by Admin",
                              watchHistory = emptyList()
                          )
                      )
                  }
                  saveToDisk()
              }

              @Synchronized
              fun adminToggleBlock(username: TextVal) {
                  val idx = accounts.indexOfFirst { it.username.equals(username, ignoreCase = true) }
                  if (idx == -1) return
                  val old = accounts[idx]
                  val nextBlocked = !old.isBlocked
                  accounts[idx] = old.copy(
                      isBlocked = nextBlocked,
                      token = if (nextBlocked) "" else old.token,
                      currentActivity = if (nextBlocked) "Blocked by Host Admin" else "Unblocked by Host Admin"
                  )
                  saveToDisk()
              }

              @Synchronized
              fun adminForceLogout(username: TextVal) {
                  val idx = accounts.indexOfFirst { it.username.equals(username, ignoreCase = true) }
                  if (idx == -1) return
                  val old = accounts[idx]
                  accounts[idx] = old.copy(
                      token = "",
                      currentActivity = "Session revoked by Admin"
                  )
                  saveToDisk()
              }

              @Synchronized
              fun adminClearUserHistory(username: TextVal) {
                  val idx = accounts.indexOfFirst { it.username.equals(username, ignoreCase = true) }
                  if (idx == -1) return
                  val old = accounts[idx]
                  accounts[idx] = old.copy(
                      watchHistory = emptyList(),
                      currentActivity = "Watch history cleared by Admin"
                  )
                  saveToDisk()
              }

              @Synchronized
              fun adminDeleteUser(username: TextVal) {
                  accounts.removeAll { it.username.equals(username, ignoreCase = true) }
                  saveToDisk()
              }
          }

          object BeastRuntimeBridge {
              var isServerPoweredOn by mutableStateOf(false) // OFF by default as requested
              var hostOnWeb by mutableStateOf(true)
              var hostOnVlc by mutableStateOf(true)
              var hostedItems by mutableStateOf(emptyList<BeastMediaItem>())
              var folderSlots by mutableStateOf(emptyList<BeastFolderSlot>())
              var accountsSnapshot by mutableStateOf(emptyList<BeastUserAccount>())
              var logsList by mutableStateOf(emptyList<BeastLogEntry>())
              var pauseLogs by mutableStateOf(false)
              var accountDb: BeastAccountDatabase? = null

              fun ensureDb(context: Context): BeastAccountDatabase {
                  val existing = accountDb
                  if (existing != null) return existing
                  val created = BeastAccountDatabase(File(context.filesDir, "beast_accounts_db.json"))
                  accountDb = created
                  accountsSnapshot = created.snapshotAccounts()
                  return created
              }

              fun syncAccountsState() {
                  accountDb?.let { db ->
                      accountsSnapshot = db.snapshotAccounts()
                  }
              }

              fun addLog(tag: TextVal, message: TextVal, isError: Boolean = false) {
                  if (pauseLogs) return
                  val entry = BeastLogEntry(System.nanoTime(), nowTimeStamp(), tag, message, isError)
                  logsList = (listOf(entry) + logsList).take(140)
              }
          }

          class BeastHostService : Service() {
              private var httpServer: BeastHttpServer? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action ?: "START"
                  if (action == "STOP") {
                      stopServerAndService()
                      return START_NOT_STICKY
                  }
                  startForegroundNotification()
                  acquireLocks()
                  startHttpServerIfNeeded()
                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "beast_host_channel"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(
                          channelId,
                          "Beast Reaming Background Server",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      nm.createNotificationChannel(chan)
                  }
                  val ip = resolveDeviceLanIp(this)
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pendingOpen = PendingIntent.getActivity(
                      this,
                      0,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notifBuilder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  val notification = notifBuilder
                      .setContentTitle("Beast Reaming Host Active")
                      .setContentText("Running in background at http://$ip:8080")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(pendingOpen)
                      .setOngoing(true)
                      .build()
                  startForeground(1001, notification)
              }

              private fun acquireLocks() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (wakeLock == null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BeastReaming::HostWakeLock").apply {
                              setReferenceCounted(false)
                              acquire(10 * 60 * 60 * 1000L)
                          }
                      }
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      if (wifiLock == null) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "BeastReaming::HostWifiLock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun startHttpServerIfNeeded() {
                  if (httpServer != null) return
                  val db = BeastRuntimeBridge.ensureDb(applicationContext)
                  try {
                      val server = BeastHttpServer(
                          resolver = contentResolver,
                          port = 8080,
                          accountDb = db,
                          webEnabledProvider = { BeastRuntimeBridge.hostOnWeb },
                          vlcEnabledProvider = { BeastRuntimeBridge.hostOnVlc },
                          catalogProvider = { BeastRuntimeBridge.hostedItems },
                          folderNamesProvider = { BeastRuntimeBridge.folderSlots.map { it.displayName } },
                          onAccountsUpdated = { BeastRuntimeBridge.syncAccountsState() },
                          logger = { tag, msg, err -> BeastRuntimeBridge.addLog(tag, msg, err) }
                      )
                      server.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                      httpServer = server
                      BeastRuntimeBridge.isServerPoweredOn = true
                      val ip = resolveDeviceLanIp(this)
                      BeastRuntimeBridge.addLog("SYSTEM", "Background Host Service started at http://$ip:8080", false)
                  } catch (e: Exception) {
                      BeastRuntimeBridge.addLog("ERROR", "Failed to start server: ${e.message}", true)
                      stopServerAndService()
                  }
              }

              private fun stopServerAndService() {
                  try { httpServer?.stop() } catch (_: Exception) {}
                  httpServer = null
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (_: Exception) {}
                  wakeLock = null
                  try { if (wifiLock?.isHeld == true) wifiLock?.release() } catch (_: Exception) {}
                  wifiLock = null
                  BeastRuntimeBridge.isServerPoweredOn = false
                  BeastRuntimeBridge.addLog("SYSTEM", "Background Host Service stopped", false)
                  stopForeground(true)
                  stopSelf()
              }

              override fun onDestroy() {
                  stopServerAndService()
                  super.onDestroy()
              }
          }

          class BoundedStream(
              inner: InputStream,
              private var bytesRemaining: Long
          ) : FilterInputStream(inner) {
              override fun read(): Int {
                  if (bytesRemaining <= 0L) return -1
                  val result = super.read()
                  if (result != -1) bytesRemaining--
                  return result
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  if (bytesRemaining <= 0L) return -1
                  val maxToRead = minOf(length.toLong(), bytesRemaining).toInt()
                  val count = super.read(buffer, offset, maxToRead)
                  if (count > 0) bytesRemaining -= count.toLong()
                  return count
              }
          }

          class BeastHttpServer(
              private val resolver: ContentResolver,
              port: Int,
              private val accountDb: BeastAccountDatabase,
              private val webEnabledProvider: () -> Boolean,
              private val vlcEnabledProvider: () -> Boolean,
              private val catalogProvider: () -> List<BeastMediaItem>,
              private val folderNamesProvider: () -> List<TextVal>,
              private val onAccountsUpdated: () -> Unit,
              private val logger: (TextVal, TextVal, Boolean) -> Unit
          ) : NanoHTTPD(port) {

              private fun buildAccountCatalogPayload(acc: BeastUserAccount): JSONObject {
                  val sortedItems = catalogProvider().sortedBy { it.name.lowercase(Locale.ROOT) }
                  val root = JSONObject()
                  root.put("ok", true)
                  root.put("username", acc.username)
                  root.put("token", acc.token)
                  root.put("hostName", Build.MODEL ?: "Android Beast Host")
                  root.put("vlcEnabled", vlcEnabledProvider())

                  val foldersArr = JSONArray()
                  folderNamesProvider().forEach { foldersArr.put(it) }
                  root.put("folders", foldersArr)

                  val historyArr = JSONArray()
                  acc.watchHistory.forEach { h ->
                      val matchedMedia = sortedItems.find { it.name == h.mediaName }
                      val hObj = JSONObject()
                      hObj.put("mediaId", matchedMedia?.id ?: -1)
                      hObj.put("mediaName", h.mediaName)
                      hObj.put("folderName", h.folderName)
                      hObj.put("positionSec", h.positionSec)
                      hObj.put("durationSec", h.durationSec)
                      hObj.put("updatedAt", h.updatedAt)
                      hObj.put("completed", h.completed)
                      historyArr.put(hObj)
                  }
                  root.put("watchHistory", historyArr)

                  val itemsArr = JSONArray()
                  sortedItems.forEach { item ->
                      val obj = JSONObject()
                      obj.put("id", item.id)
                      obj.put("name", item.name)
                      obj.put("folderName", item.folderName)
                      obj.put("sizeBytes", item.sizeBytes)
                      obj.put("mimeType", item.mimeType)
                      obj.put("webStreamPath", item.webStreamPath)
                      obj.put("vlcPath", item.vlcPath)
                      obj.put("srtPath", if (item.srtUri != null) item.srtPath else "")
                      itemsArr.put(obj)
                  }
                  root.put("items", itemsArr)
                  return root
              }

              override fun serve(session: IHTTPSession): Response {
                  val uriPath = session.uri ?: "/"
                  val clientIp = session.remoteIpAddress ?: "LAN"
                  val params = session.parameters

                  // 1. VLC Direct Streaming Endpoints (/vlc/<id>/...)
                  if (uriPath.startsWith("/vlc/")) {
                      if (!vlcEnabledProvider()) {
                          logger("VLC", "Blocked VLC request from $clientIp (Host on VLC is OFF)", true)
                          return newFixedLengthResponse(Response.Status.FORBIDDEN, MIME_PLAINTEXT, "Host on VLC is disabled.")
                      }
                      val segments = uriPath.removePrefix("/vlc/").split("/")
                      val itemId = segments.firstOrNull()?.toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "File not found")
                      if (segments.lastOrNull()?.endsWith(".srt") == true && media.srtUri != null) {
                          logger("VLC", "Serving .srt subtitle for ${media.name} to $clientIp", false)
                          val srtStream = resolver.openInputStream(media.srtUri)
                              ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "No SRT")
                          return newChunkedResponse(Response.Status.OK, "text/plain; charset=utf-8", srtStream)
                      }
                      logger("VLC", "VLC stream connected ($clientIp) -> ${media.name}", false)
                      return serveMediaWithRange(session, media, clientIp, "VLC")
                  }

                  // 2. Host Local Fullscreen Preview (/localstream/<id> and /localsrt/<id>)
                  if (uriPath.startsWith("/localstream/")) {
                      val itemId = uriPath.removePrefix("/localstream/").substringBefore("/").toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "Not found")
                      return serveMediaWithRange(session, media, "HostDevice", "LOCAL")
                  }
                  if (uriPath.startsWith("/localsrt/")) {
                      val itemId = uriPath.removePrefix("/localsrt/").substringBefore("/").toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                      val srtUri = media?.srtUri
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "No SRT")
                      val rawSrt = resolver.openInputStream(srtUri)?.bufferedReader()?.use { it.readText() } ?: ""
                      return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=utf-8", rawSrt)
                  }

                  // 3. Web Hosting Check
                  if (!webEnabledProvider()) {
                      logger("WEB", "Blocked Website request from $clientIp (Host on Web is OFF)", true)
                      return newFixedLengthResponse(
                          Response.Status.FORBIDDEN,
                          "text/html; charset=utf-8",
                          "<html><body style='background:#080511;color:#ffd54f;font-family:sans-serif;text-align:center;padding:48px;'><h2>Beast Reaming Web Hosting is OFF</h2><p>Turn ON 'Host on Web' on the hosting Android device.</p></body></html>"
                      )
                  }

                  // 4. Sign Up API (creates account and immediately logs the user in without a second login!)
                  if (uriPath == "/api/signup") {
                      val u = params["u"]?.firstOrNull() ?: ""
                      val p = params["p"]?.firstOrNull() ?: ""
                      val created = accountDb.signUpAndAutoLogin(u, p)
                      onAccountsUpdated()
                      if (created == null) {
                          logger("AUTH", "Sign-up failed for '$u' ($clientIp) - username taken or invalid", true)
                          val err = JSONObject().apply {
                              put("ok", false)
                              put("error", "Username already exists or is too short (min 2 chars).")
                          }
                          return newFixedLengthResponse(Response.Status.BAD_REQUEST, "application/json", err.toString())
                      }
                      logger("AUTH", "New account '${created.username}' signed up & auto-logged in ($clientIp)", false)
                      val payload = buildAccountCatalogPayload(created)
                      return newFixedLengthResponse(Response.Status.OK, "application/json", payload.toString())
                  }

                  // 5. Sign In API
                  if (uriPath == "/api/signin") {
                      val u = params["u"]?.firstOrNull() ?: ""
                      val p = params["p"]?.firstOrNull() ?: ""
                      val account = accountDb.signIn(u, p)
                      onAccountsUpdated()
                      if (account == null) {
                          logger("AUTH", "Failed sign-in for '$u' from $clientIp", true)
                          val err = JSONObject().apply {
                              put("ok", false)
                              put("error", "Invalid username/password or account is blocked by Admin.")
                          }
                          return newFixedLengthResponse(Response.Status.UNAUTHORIZED, "application/json", err.toString())
                      }
                      logger("AUTH", "User '${account.username}' signed in from $clientIp", false)
                      val payload = buildAccountCatalogPayload(account)
                      return newFixedLengthResponse(Response.Status.OK, "application/json", payload.toString())
                  }

                  // 6. Session Restore / Catalog Refresh API (keeps user logged in across page refreshes!)
                  if (uriPath == "/api/session") {
                      val token = params["token"]?.firstOrNull() ?: ""
                      val account = accountDb.findByToken(token)
                      if (account == null) {
                          val err = JSONObject().apply {
                              put("ok", false)
                              put("error", "Session expired or logged out")
                          }
                          return newFixedLengthResponse(Response.Status.UNAUTHORIZED, "application/json", err.toString())
                      }
                      val payload = buildAccountCatalogPayload(account)
                      return newFixedLengthResponse(Response.Status.OK, "application/json", payload.toString())
                  }

                  // 7. Log Out API
                  if (uriPath == "/api/logout") {
                      val token = params["token"]?.firstOrNull() ?: ""
                      val acc = accountDb.findByToken(token)
                      accountDb.logoutByToken(token)
                      onAccountsUpdated()
                      if (acc != null) {
                          logger("AUTH", "User '${acc.username}' logged out ($clientIp)", false)
                      }
                      val res = JSONObject().apply { put("ok", true) }
                      return newFixedLengthResponse(Response.Status.OK, "application/json", res.toString())
                  }

                  // 8. Watch Progress & History Sync API (/api/progress)
                  if (uriPath == "/api/progress") {
                      val token = params["token"]?.firstOrNull() ?: ""
                      val mediaId = params["id"]?.firstOrNull()?.toIntOrNull() ?: -1
                      val posSec = params["pos"]?.firstOrNull()?.toIntOrNull() ?: 0
                      val durSec = params["dur"]?.firstOrNull()?.toIntOrNull() ?: 0
                      val ended = params["ended"]?.firstOrNull() == "1"
                      val media = catalogProvider().find { it.id == mediaId }
                      if (media != null) {
                          val updatedAcc = accountDb.recordWatchProgress(
                              token = token,
                              mediaName = media.name,
                              folderName = media.folderName,
                              positionSec = posSec,
                              durationSec = durSec,
                              ended = ended
                          )
                          onAccountsUpdated()
                          if (updatedAcc != null) {
                              val payload = buildAccountCatalogPayload(updatedAcc)
                              return newFixedLengthResponse(Response.Status.OK, "application/json", payload.toString())
                          }
                      }
                      return newFixedLengthResponse(Response.Status.UNAUTHORIZED, "application/json", "{}")
                  }

                  // 9. Authenticated Web Video Stream (/webstream/<id>/...)
                  if (uriPath.startsWith("/webstream/")) {
                      val token = params["token"]?.firstOrNull() ?: ""
                      val acc = accountDb.findByToken(token)
                          ?: return newFixedLengthResponse(Response.Status.UNAUTHORIZED, MIME_PLAINTEXT, "Login required")
                      val segments = uriPath.removePrefix("/webstream/").split("/")
                      val itemId = segments.firstOrNull()?.toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "Media not found")
                      return serveMediaWithRange(session, media, "${acc.username}@$clientIp", "WEB/206")
                  }

                  // 10. Authenticated Web Subtitle Stream (/websrt/<id>/...)
                  if (uriPath.startsWith("/websrt/")) {
                      val token = params["token"]?.firstOrNull() ?: ""
                      accountDb.findByToken(token)
                          ?: return newFixedLengthResponse(Response.Status.UNAUTHORIZED, MIME_PLAINTEXT, "Login required")
                      val itemId = uriPath.removePrefix("/websrt/").substringBefore("/").toIntOrNull()
                      val media = catalogProvider().find { it.id == itemId }
                      val srtUri = media?.srtUri
                          ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "No SRT")
                      val rawSrt = resolver.openInputStream(srtUri)?.bufferedReader()?.use { it.readText() } ?: ""
                      val nl = Char(10).toString()
                      val vttBody = rawSrt.lines().joinToString(separator = nl) { line ->
                          if (line.contains("-->")) line.replace(',', '.') else line
                      }
                      val vtt = "WEBVTT" + nl + nl + vttBody
                      return newFixedLengthResponse(Response.Status.OK, "text/vtt; charset=utf-8", vtt)
                  }

                  return serveWebPortalHtml()
              }

              private fun serveMediaWithRange(
                  session: IHTTPSession,
                  media: BeastMediaItem,
                  clientLabel: TextVal,
                  logTag: TextVal
              ): Response {
                  val totalLength = media.sizeBytes
                  val rangeHeader = session.headers["range"]
                  try {
                      if (rangeHeader != null && rangeHeader.startsWith("bytes=") && totalLength > 0L) {
                          val rangeValue = rangeHeader.removePrefix("bytes=").trim()
                          val parts = rangeValue.split("-")
                          val startByte = parts.getOrNull(0)?.toLongOrNull() ?: 0L
                          val endByte = parts.getOrNull(1)?.takeIf { it.isNotEmpty() }?.toLongOrNull()
                              ?: (totalLength - 1L)
                          val safeEnd = endByte.coerceAtMost(totalLength - 1L)
                          if (startByte in 0 until totalLength && startByte <= safeEnd) {
                              val contentLen = (safeEnd - startByte) + 1L
                              val rawStream = resolver.openInputStream(media.uri)
                                  ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Stream open error")
                              var skipped = 0L
                              while (skipped < startByte) {
                                  val step = rawStream.skip(startByte - skipped)
                                  if (step <= 0L) break
                                  skipped += step
                              }
                              if (startByte == 0L) {
                                  logger(logTag, "Streaming ${media.name} -> $clientLabel", false)
                              }
                              val bounded = BoundedStream(rawStream, contentLen)
                              return newFixedLengthResponse(
                                  Response.Status.PARTIAL_CONTENT,
                                  media.mimeType,
                                  bounded,
                                  contentLen
                              ).apply {
                                  addHeader("Accept-Ranges", "bytes")
                                  addHeader("Content-Range", "bytes $startByte-$safeEnd/$totalLength")
                                  addHeader("Content-Length", contentLen.toString())
                                  addHeader("Access-Control-Allow-Origin", "*")
                              }
                          }
                      }
                      logger(logTag, "Full stream ${media.name} -> $clientLabel", false)
                      val stream = resolver.openInputStream(media.uri)
                          ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Stream error")
                      val resp = if (totalLength > 0L) {
                          newFixedLengthResponse(Response.Status.OK, media.mimeType, stream, totalLength)
                      } else {
                          newChunkedResponse(Response.Status.OK, media.mimeType, stream)
                      }
                      resp.addHeader("Accept-Ranges", "bytes")
                      resp.addHeader("Access-Control-Allow-Origin", "*")
                      return resp
                  } catch (e: Exception) {
                      logger("ERROR", "Stream error for ${media.name}: ${e.message}", true)
                      return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Error: ${e.message}")
                  }
              }

              private fun serveWebPortalHtml(): Response {
