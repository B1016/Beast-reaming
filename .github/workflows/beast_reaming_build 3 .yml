          fun resolveDeviceLanIp(context: Context): TextVal {
              try {
                  val interfaces = NetworkInterface.getNetworkInterfaces()
                  while (interfaces.hasMoreElements()) {
                      val intf = interfaces.nextElement()
                      if (!intf.isUp || intf.isLoopback) continue
                      val addrs = intf.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val addr = addrs.nextElement()
                          if (addr is Inet4Address && !addr.isLoopbackAddress) {
                              val ip = addr.hostAddress ?: continue
                              if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                  return ip
                              }
                          }
                      }
                  }
                  val wifiMgr = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                  val ipInt = wifiMgr?.connectionInfo?.ipAddress ?: 0
                  if (ipInt != 0) {
                      return String.format(
                          Locale.US,
                          "%d.%d.%d.%d",
                          ipInt and 0xff,
                          ipInt shr 8 and 0xff,
                          ipInt shr 16 and 0xff,
                          ipInt shr 24 and 0xff
                      )
                  }
              } catch (_: Exception) {}
              return "192.168.43.1"
          }

          fun generateWebsiteQrBitmap(urlContent: TextVal, sizePx: Int = 420): Bitmap? {
              return try {
                  val matrix = QRCodeWriter().encode(urlContent, BarcodeFormat.QR_CODE, sizePx, sizePx)
                  val bmp = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val darkPixel = 0xFF1A1200.toInt()
                  val goldPixel = 0xFFFFE082.toInt()
                  for (x in 0 until sizePx) {
                      for (y in 0 until sizePx) {
                          bmp.setPixel(x, y, if (matrix.get(x, y)) darkPixel else goldPixel)
                      }
                  }
                  bmp
              } catch (_: Exception) {
                  null
              }
          }

          fun scanSelectedFoldersAlphabetical(context: Context, uriStrings: List<TextVal>): BeastScanResult {
              val slots = mutableListOf<BeastFolderSlot>()
              val rawMedia = mutableListOf<BeastMediaItem>()
              val srtMap = HashMap<TextVal, Uri>()
              val pendingFiles = mutableListOf<BeastDocNode>()

              fun walkNode(node: DocumentFile, folderLabel: TextVal, depth: Int) {
                  if (depth > 3) return
                  val children = try { node.listFiles() } catch (_: Exception) { emptyArray() }
                  for (child in children) {
                      if (child.isDirectory) {
                          walkNode(child, folderLabel, depth + 1)
                      } else if (child.isFile) {
                          val fname = child.name ?: continue
                          val baseKey = folderLabel + "/" + fname.substringBeforeLast(".")
                          if (fname.lowercase(Locale.ROOT).endsWith(".srt")) {
                              srtMap[baseKey.lowercase(Locale.ROOT)] = child.uri
                          } else {
                              pendingFiles.add(BeastDocNode(child, fname, folderLabel))
                          }
                      }
                  }
              }

              for ((idx, rawUri) in uriStrings.take(3).withIndex()) {
                  val parsed = Uri.parse(rawUri)
                  val rootDoc = DocumentFile.fromTreeUri(context, parsed)
                  if (rootDoc != null && rootDoc.exists()) {
                      val label = rootDoc.name ?: "Folder ${idx + 1}"
                      val before = pendingFiles.size
                      walkNode(rootDoc, label, 0)
                      slots.add(BeastFolderSlot(rawUri, label, pendingFiles.size - before))
                  }
              }

              val sortedPending = pendingFiles.sortedBy { it.fileName.lowercase(Locale.ROOT) }
              var nextId = 1
              for ((doc, fileName, folderLabel) in sortedPending) {
                  val mime = doc.type ?: guessMimeFromName(fileName)
                  val safeUrlName = URLEncoder.encode(fileName, "UTF-8").replace("+", "%20")
                  val baseKey = (folderLabel + "/" + fileName.substringBeforeLast(".")).lowercase(Locale.ROOT)
                  val matchedSrt = srtMap[baseKey]
                  rawMedia.add(
                      BeastMediaItem(
                          id = nextId,
                          name = fileName,
                          folderName = folderLabel,
                          sizeBytes = doc.length(),
                          mimeType = mime,
                          uri = doc.uri,
                          srtUri = matchedSrt,
                          vlcPath = "/vlc/$nextId/$safeUrlName",
                          webStreamPath = "/webstream/$nextId/$safeUrlName",
                          srtPath = "/websrt/$nextId/sub.srt"
                      )
                  )
                  nextId++
              }
              return BeastScanResult(slots, rawMedia)
          }

          fun guessMimeFromName(name: TextVal): TextVal {
              val lower = name.lowercase(Locale.ROOT)
              return when {
                  lower.endsWith(".mp4") || lower.endsWith(".m4v") -> "video/mp4"
                  lower.endsWith(".mkv") -> "video/x-matroska"
                  lower.endsWith(".webm") -> "video/webm"
                  lower.endsWith(".avi") -> "video/x-msvideo"
                  lower.endsWith(".mov") -> "video/quicktime"
                  lower.endsWith(".mp3") -> "audio/mpeg"
                  lower.endsWith(".flac") -> "audio/flac"
                  lower.endsWith(".wav") -> "audio/wav"
                  else -> "application/octet-stream"
              }
          }

          fun formatByteSize(bytes: Long): TextVal {
              val mb = bytes.toDouble() / (1024.0 * 1024.0)
              return if (mb >= 1024.0) {
                  String.format(Locale.US, "%.2f GB", mb / 1024.0)
              } else if (mb >= 1.0) {
                  String.format(Locale.US, "%.1f MB", mb)
              } else {
                  String.format(Locale.US, "%d KB", (bytes / 1024L).coerceAtLeast(1L))
              }
          }

          fun formatDurationMs(ms: Int): TextVal {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val mins = totalSec / 60
              val secs = totalSec % 60
              return String.format(Locale.US, "%02d:%02d", mins, secs)
          }

          fun parseSrtContent(raw: TextVal): List<BeastSubtitleCue> {
              val cues = mutableListOf<BeastSubtitleCue>()
              val currentBlock = mutableListOf<TextVal>()
              fun flushBlock() {
                  val timeIdx = currentBlock.indexOfFirst { it.contains("-->") }
                  if (timeIdx != -1 && timeIdx + 1 < currentBlock.size) {
                      val parts = currentBlock[timeIdx].split("-->")
                      if (parts.size == 2) {
                          val start = parseSrtTimestamp(parts[0].trim())
                          val end = parseSrtTimestamp(parts[1].trim())
                          val text = currentBlock.subList(timeIdx + 1, currentBlock.size).joinToString(" ")
                          cues.add(BeastSubtitleCue(start, end, text))
                      }
                  }
                  currentBlock.clear()
              }
              for (rawLine in raw.lines()) {
                  val trimmed = rawLine.trim()
                  if (trimmed.isEmpty()) {
                      if (currentBlock.isNotEmpty()) flushBlock()
                  } else {
                      currentBlock.add(trimmed)
                  }
              }
              if (currentBlock.isNotEmpty()) flushBlock()
              return cues
          }

          fun parseSrtTimestamp(ts: TextVal): Long {
              return try {
                  val clean = ts.replace(",", ".").trim()
                  val p = clean.split(":")
                  val h = p[0].toLong()
                  val m = p[1].toLong()
                  val secParts = p[2].split(".")
                  val s = secParts[0].toLong()
                  val ms = secParts.getOrNull(1)?.padEnd(3, '0')?.take(3)?.toLong() ?: 0L
                  ((h * 3600L + m * 60L + s) * 1000L) + ms
              } catch (_: Exception) {
                  0L
              }
          }

          fun copyTextToClipboard(context: Context, label: TextVal, value: TextVal) {
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText(label, value))
              Toast.makeText(context, "Copied: $value", Toast.LENGTH_SHORT).show()
          }

          fun toggleBackgroundHostService(context: Context, turnOn: Boolean) {
              val intent = Intent(context, BeastHostService::class.java).apply {
                  action = if (turnOn) "START" else "STOP"
              }
              try {
                  if (turnOn) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent)
                      } else {
                          context.startService(intent)
                      }
                  } else {
                      context.startService(intent)
                  }
              } catch (e: Exception) {
                  BeastRuntimeBridge.addLog("ERROR", "Service toggle error: ${e.message}", true)
              }
          }

          @Composable
          fun HollowLionEmblem(modifier: Modifier = Modifier) {
              val goldenBrush = Brush.linearGradient(
                  colors = listOf(Color(0xFFFFF59D), Color(0xFFFFCA28), Color(0xFFFF8F00))
              )
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
