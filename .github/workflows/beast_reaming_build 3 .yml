                      val lionPath = Path().apply {
                          moveTo(w * 0.50f, h * 0.08f)
                          lineTo(w * 0.78f, h * 0.18f)
                          lineTo(w * 0.92f, h * 0.42f)
                          lineTo(w * 0.85f, h * 0.70f)
                          lineTo(w * 0.68f, h * 0.88f)
                          lineTo(w * 0.50f, h * 0.95f)
                          lineTo(w * 0.32f, h * 0.88f)
                          lineTo(w * 0.15f, h * 0.70f)
                          lineTo(w * 0.08f, h * 0.42f)
                          lineTo(w * 0.22f, h * 0.18f)
                          close()
                          moveTo(w * 0.26f, h * 0.38f)
                          lineTo(w * 0.42f, h * 0.44f)
                          lineTo(w * 0.50f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.44f)
                          lineTo(w * 0.74f, h * 0.38f)
                          moveTo(w * 0.42f, h * 0.62f)
                          lineTo(w * 0.58f, h * 0.62f)
                          lineTo(w * 0.50f, h * 0.72f)
                          close()
                          moveTo(w * 0.50f, h * 0.72f)
