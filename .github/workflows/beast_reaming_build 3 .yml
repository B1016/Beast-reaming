      - name: Generate Beast Reaming v3 Kotlin Source (Accounts DB, Web History, Background Host, Admin UI, ZXing QR)
        run: |
          cat << 'EOF' > app/src/main/java/com/beastreaming/app/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)
